<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C5F7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="現調ノート">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>現調ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Roboto+Mono:wght@400;500&display=swap">

<style>
:root{
  --hdrH:54px;
  --paper:#FAFAF8; --surface:#FFFFFF; --surface-2:#F1F3F0; --sunken:#ECEFEA;
  --ink:#18222B; --ink-2:#51606B; --ink-3:#8B959D;
  --line:#DBE0DC; --grid:#E8EBE6;
  --accent:#2C5F7C; --accent-ink:#FFFFFF; --accent-soft:#E3EDF3;
  --amber:#9C6708; --amber-soft:#FAF1DE;
  --ok:#3B7A58; --crit:#A2372E; --crit-soft:#F8E7E4;
  --shadow:0 1px 2px rgba(24,34,43,.06), 0 4px 14px rgba(24,34,43,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11171C; --surface:#19222A; --surface-2:#212C35; --sunken:#141C23;
  --ink:#E7ECEF; --ink-2:#A4B1BA; --ink-3:#6E7C87;
  --line:#2B3843; --grid:#1D2730;
  --accent:#79B4D4; --accent-ink:#0E1519; --accent-soft:#1B2E3A;
  --amber:#E2AC50; --amber-soft:#33290F;
  --ok:#6DBE93; --crit:#E28275; --crit-soft:#33201D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#11171C; --surface:#19222A; --surface-2:#212C35; --sunken:#141C23;
  --ink:#E7ECEF; --ink-2:#A4B1BA; --ink-3:#6E7C87;
  --line:#2B3843; --grid:#1D2730;
  --accent:#79B4D4; --accent-ink:#0E1519; --accent-soft:#1B2E3A;
  --amber:#E2AC50; --amber-soft:#33290F;
  --ok:#6DBE93; --crit:#E28275; --crit-soft:#33201D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-weight:700;text-wrap:balance}
.num{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.wrap{max-width:580px;margin:0 auto;padding:0 14px 128px}
header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr{max-width:580px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:9px;min-height:54px}
.mark{width:26px;height:26px;flex:none;border-radius:5px;background:var(--accent);position:relative}
.mark::before,.mark::after{content:"";position:absolute;left:5px;right:5px;height:1.5px;background:var(--accent-ink);opacity:.9}
.mark::before{top:8px} .mark::after{bottom:8px}
.hdr h1{font-size:16px;margin:0;letter-spacing:.02em}
.hdr .sub{font-size:11px;color:var(--ink-3);letter-spacing:.06em;margin-top:-2px}
.hdr .spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.role{font-weight:700;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.iconbtn.role[data-r="iss"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

/* 戻る導線。どの画面にも必ず置く */
.stickynav{position:sticky;top:var(--hdrH);z-index:25;background:var(--paper);
  margin:0 -14px;padding:0 14px 2px;box-shadow:0 8px 10px -9px rgba(24,34,43,.25)}
.backbar{display:flex;align-items:center;gap:8px;padding:12px 0 6px}
.backbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink);
  box-shadow:var(--shadow);white-space:nowrap}
.backbtn:hover{background:var(--surface-2)}
.backbar .where{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.card-h h2,.card-h h3{margin:0;font-size:15px}
.card-b{padding:12px 14px 14px}
.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}

.rowlist{display:flex;flex-direction:column}
.rowitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  border-top:1px solid var(--line);padding:13px 14px;cursor:pointer;color:inherit}
.rowitem:first-child{border-top:none}
.rowitem:hover{background:var(--surface-2)}
.rowitem .t{flex:1;min-width:0}
.rowitem .t b{display:block;font-weight:700;font-size:15px}
.rowitem .t>span{display:block;font-size:12px;color:var(--ink-3)}
.chev{color:var(--ink-3);font-size:16px;flex:none}
.cnt{flex:none;font-size:12px;color:var(--ink-3);text-align:right;line-height:1.4}
.cnt b{display:block;font-size:16px;color:var(--accent);font-family:"Roboto Mono",monospace}
.cnt.zero b{color:var(--ink-3)}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
/* iOSは入力欄の文字が16px未満だと、タップした瞬間に画面を勝手に拡大して戻さない。
   現調中にいちいちピンチアウトするはめになるので、入力欄は必ず16px以上にする。 */
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:16px}
textarea{resize:vertical;min-height:56px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--accent);border:1px dashed var(--line)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:7px}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--line)}

/* 選択チップ */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px}
.chips button{background:var(--sunken);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chips button:hover{background:var(--accent-soft);color:var(--accent)}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chips.sm button{padding:4px 9px;font-size:11.5px}
/* 登録した鍵場所。本体を押すと入り、×で登録を消す */
.keychip{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sunken)}
.keychip.on{border-color:var(--accent);background:var(--accent);}
.keychip button{background:none;border:none;padding:5px 10px;font-size:11.5px;color:var(--ink-2);cursor:pointer}
.keychip.on button{color:var(--accent-ink);font-weight:700}
.keychip button:last-child{padding:5px 8px;border-left:1px solid var(--line);color:var(--ink-3)}
.keychip.on button:last-child{border-left-color:rgba(255,255,255,.35)}
.keychip button:last-child:hover{color:var(--crit)}
.chips button.add{border-style:dashed;color:var(--accent)}
/* 工種画面の「押すと行が増える」チップ */
.addchips{display:flex;flex-wrap:wrap;gap:6px}
.addchips button{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;
  padding:9px 13px;font-size:13.5px;font-weight:700;color:var(--accent);cursor:pointer}
.addchips button:hover{background:var(--accent);color:var(--accent-ink)}
.addchips button .n{font-weight:400;font-size:10.5px;opacity:.7;margin-left:3px}
.addchips button.free{background:none;border-style:dashed;color:var(--ink-2);border-color:var(--line);font-weight:400}

.guide{background:var(--accent-soft);border-radius:7px;padding:8px 10px;margin-bottom:9px;
  font-size:11.5px;line-height:1.65;color:var(--ink-2)}
.guide b{color:var(--accent)}

/* 拾い出しの1行 */
.line{border-top:1px solid var(--line);padding:12px 0}
.line:first-of-type{border-top:none}
.line .top{display:flex;align-items:flex-start;gap:8px}
.line .nm{flex:1;min-width:0;font-size:14.5px;font-weight:700;line-height:1.45}
.line .x{background:none;border:none;color:var(--ink-3);font-size:17px;cursor:pointer;padding:0 2px;flex:none}
.line .x:hover{color:var(--crit)}
.qrow{display:grid;grid-template-columns:1fr 88px auto;gap:7px;align-items:center;margin-top:8px}
.qrow input,.qrow select{padding:8px 6px;font-size:16px}
.qrow input[type=number]{text-align:right}
.qrow .u{font-size:12px;color:var(--ink-3);min-width:24px}
.qlab{display:grid;grid-template-columns:1fr 88px auto;gap:7px;font-size:10px;letter-spacing:.06em;color:var(--ink-3);margin-top:6px}
.qlab span:nth-child(2){text-align:right;padding-right:3px}
.sub{text-align:right;font-size:14px;color:var(--amber);font-weight:500;margin-top:5px}

.line.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.line.flash{animation:none}}
/* 場所ごとの行。ノートに書き足していく感覚 */
.rows{background:var(--sunken);border-radius:8px;padding:9px;margin-top:8px;
  --gc:1fr 72px 72px 58px 26px; --gcs:1fr 54px 54px 44px 20px}
.rhead{display:grid;grid-template-columns:var(--gc);gap:5px;
  font-size:9.5px;letter-spacing:.05em;color:var(--ink-3);margin-bottom:4px}
.rhead span:nth-child(n+2){text-align:right;padding-right:2px}
.rhead span.c{text-align:center;padding-right:0}
.rrow.now{background:var(--accent-soft);border-radius:8px;
  box-shadow:0 0 0 4px var(--accent-soft)}
.rrow{display:grid;grid-template-columns:var(--gc);gap:5px;align-items:center;margin-bottom:4px;
  padding:2px 4px;margin-left:-4px;margin-right:-4px;border-radius:7px;border:1px solid transparent}
/* いまパッドが書き込む行。ここが分からないと上下の対応が読めない */
.rrow.on{border-color:var(--accent);background:var(--accent-soft)}
.rrow input{padding:7px 6px;font-size:16px;background:var(--surface)}
.rrow input.num{text-align:right}
/* ▲▼のスピナーは現場では押せない。消して、タップ＝テンキーに一本化する */
.rrow input[type=number]{-moz-appearance:textfield}
.rrow input[type=number]::-webkit-outer-spin-button,
.rrow input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rrow .o{text-align:right;font-size:13.5px;color:var(--amber)}
.rrow .d{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:18px;padding:0;
  height:41px;line-height:1}
.rrow .d:hover{color:var(--crit)}
.hpad{margin-top:9px}
/* 場所の欄の横の ▾ */
.pcell{display:flex;gap:3px;min-width:0}
.pcell input{min-width:0}
.pdrop{flex:none;width:24px;border:1px solid var(--line);background:var(--surface);
  border-radius:6px;color:var(--ink-3);font-size:12px;cursor:pointer;padding:0}
.pdrop:hover{border-color:var(--accent);color:var(--accent)}
/* いま触っている行の、場所と規格・仕様 */
.pickrow{display:flex;gap:7px;align-items:flex-start;margin-bottom:7px}
.plab{flex:none;width:30px;font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);padding-top:7px}
.pchips{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.pchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.pchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:700}
.pchips button.add{border-style:dashed;color:var(--accent)}
.specpick{flex-wrap:wrap}
input.rspec{flex-basis:100%;margin-left:37px;width:auto}
.hrow{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.hrow .lbl{font-size:10px;letter-spacing:.08em;color:var(--ink-3);width:26px;flex:none}
.hrow .dot{color:var(--ink-3);font-size:15px;margin-left:2px}
.hrow button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:9px 0;text-align:center;font-family:"Roboto Mono",monospace;
  font-size:15px;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.hrow[hidden]{display:none}          /* .hrow の display:flex に負けないよう明示する */
.hrow button.dec{font-size:14px;color:var(--ink-2)}
.hrow button.plus{font-size:12px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-color:var(--accent-soft);flex:1.3}
.hrow button.fav{font-size:16px;font-weight:700}
.hrow .lbl.unit{font-family:"Roboto Mono",monospace;font-size:11.5px;letter-spacing:0;
  color:var(--accent);font-weight:700;text-align:right;padding-right:3px}
.padnote{margin:2px 0 0;font-size:10.5px}
/* 材料の取り方。現場で木目の向きを決めるところ */
/* 書き留めたことを一瞬だけ伝える帯 */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);
  bottom:calc(var(--dockH,74px) + 12px);z-index:60;max-width:min(92vw,540px);
  background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;
  font-size:13px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
  text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }
/* いまの記録の状態 */
.savedbar{background:var(--accent-soft);border-radius:11px;padding:11px 14px;margin-bottom:12px}
.savedbar b{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:14.5px;color:var(--accent)}
.savedbar span{display:block;font-size:11.5px;color:var(--ink-2);line-height:1.7;margin-top:2px}
/* 書いた工種の印 */
.rowitem.done .t b{color:var(--accent)}
.wmark{margin-left:7px;font-size:10px;font-weight:700;letter-spacing:.04em;
  background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;
  vertical-align:1.5px}
/* 工種の項目ボタン。スクロールしても消えないように上に貼りつける */
.addwrap{position:sticky;top:var(--hdrH);z-index:12;background:var(--surface);
  margin:-4px -2px 4px;padding:8px 2px 6px;border-bottom:1px solid var(--line)}
.addchips button{font-size:14px!important;padding:9px 13px!important}
.addchips button .n{font-size:10px!important}
@media (max-width:480px){
  .addwrap{max-height:38vh;overflow-y:auto}
  .addchips button{font-size:13.5px!important;padding:8px 11px!important}
}
/* 声・メモからの取り込み */
.free.imp{border-color:var(--crit)!important;color:var(--crit)!important;font-weight:700}
/* 項目の右肩のマイク。押している間だけ赤く息をする */
/* 写真。見本は小さく、押すと大きく出る */
.warnbar{margin:0 0 10px;padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.7;
  background:var(--crit-soft);border:1px solid var(--crit);color:var(--ink)}
.warnbar b{font-weight:700}
.picstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.picadd{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;
  border:1px dashed var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;
  color:var(--ink-2);min-height:44px}
.picadd input{display:none}
.picadd span{font-size:16px;line-height:1}
.picadd b{font-weight:600;font-size:12.5px}
.picadd .n{font-size:11px;font-weight:700;background:var(--ok);color:#fff;border-radius:9px;
  padding:1px 7px;line-height:1.6}
.picthumb{width:52px;height:52px;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);flex:none}
.picthumb img{width:100%;height:100%;object-fit:cover;display:block}
.shotrow{border-bottom:1px solid var(--line-soft);padding:2px 0 8px}
.shotrow:last-child{border-bottom:0}
#fbbox{display:none}
#fbbox[open]{display:flex;position:fixed;inset:0;z-index:95;align-items:flex-end;
  justify-content:center;background:rgba(8,12,16,.5)}
.fb-in{background:var(--surface);width:100%;max-width:560px;border-radius:14px 14px 0 0;
  padding:16px 16px 22px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto}
.fb-h{display:flex;align-items:center;gap:10px}
.fb-h b{font-size:16px;font-weight:700}
.fb-x{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;min-height:38px}
.fb-n{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.75}
.fb-in textarea{width:100%;font-size:16px;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:inherit;line-height:1.7}
.fb-b{display:flex;gap:8px}
.fb-b .btn{flex:1}
.fb-s{font-size:13px;line-height:1.7}
#picview{display:none}
#picview[open]{display:flex;position:fixed;inset:0;z-index:90;flex-direction:column;
  background:rgba(8,12,16,.94)}
.pv-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;flex:none}
.pv-t{font-size:13px;opacity:.85;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-del,.pv-x{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:40px}
.pv-del{border-color:rgba(255,120,100,.7);color:#ff9a88}
.pv-im{flex:1;display:flex;align-items:center;justify-content:center;padding:0 10px 16px;min-height:0}
.pv-im img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.walkmic{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;
  padding:16px 18px;border-radius:13px;border:2px solid var(--accent);background:var(--surface);
  cursor:pointer;text-align:left;margin-bottom:12px;min-height:74px}
.walkmic .mic{color:var(--crit);font-size:13px;line-height:1}
.walkmic b{font-size:16px;font-weight:700;color:var(--ink)}
.walkmic .sub{font-size:12.5px;color:var(--ink-2)}
.walkmic.on{border-color:var(--crit);background:var(--crit-soft)}
.walkmic.on .mic{animation:pulse 1.4s infinite}
.walkhead{display:flex;flex-direction:column;gap:1px}
.wh{display:flex;align-items:baseline;gap:12px;padding:9px 2px;
  border-bottom:1px solid var(--line-soft)}
.wh:last-child{border-bottom:0}
.wh .l{font-size:13px;font-weight:700;color:var(--ink-2);min-width:8.5em;flex:none}
.wh .v{font-size:14px;color:var(--ink-3)}
.wh .v i{font-style:normal;font-size:12.5px}
.wh.on .v{color:var(--ink);font-weight:700}
.walklog{display:flex;flex-direction:column}
.wl{display:flex;gap:11px;padding:8px 2px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.wl:last-child{border-bottom:0}
.wl .t{color:var(--ink-3);font-size:11.5px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
.wl .b{color:var(--ink);line-height:1.65}
.wl.place .b{font-weight:700;color:var(--accent)}
.wl.item .b{font-weight:700}
.wl.spec .b{color:var(--accent)}
.wl.head .b{font-weight:700}
.wl.doubt .b{color:var(--amber)}
.wl.bad .b{color:var(--crit)}
/* 工種ページの頭。声は押す物として立てる。項目チップに紛れさせない */
/* エアコンは部屋ごと。1行1部屋で、＋−で数える */
.chiri{margin-top:9px;padding:10px 12px;border-radius:9px;background:var(--amber-soft);
  border:1px solid var(--amber);display:flex;flex-direction:column;gap:7px}
.chiri .q{font-size:13px;font-weight:700;color:var(--ink)}
.chiri .q2{font-size:12px;color:var(--ink-2)}
.chiri .ok{font-size:12px;font-weight:700;color:var(--ok)}
/* 使い方の中身。読み物なので、行間を広めに */
.hlp{font-size:13.5px;line-height:1.9;color:var(--ink-2)}
.hlp p{margin:0 0 10px}
.hlp b{color:var(--ink)}
.hlp h4{font-family:"Zen Kaku Gothic New",sans-serif;font-size:14px;font-weight:700;
  color:var(--ink);margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)}
.hlp ul,.hlp ol{margin:0 0 10px;padding-left:20px}
.hlp li{margin-bottom:5px}
.hlp .hn{background:var(--surface-2);border-radius:8px;padding:9px 11px;font-size:12.5px}
.hlp .hng li{color:var(--ink-2)}
.hlpt{width:100%;border-collapse:collapse;margin-bottom:10px}
.hlpt td{padding:7px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:13px}
.hlpt td:first-child{width:4.2em;white-space:nowrap;color:var(--accent)}
.hlpt tr:last-child td{border-bottom:0}
.hlpc{background:var(--sunken);border-radius:8px;padding:11px 13px;margin:0 0 10px;
  font-family:"Roboto Mono",monospace;font-size:12.5px;line-height:1.9;color:var(--ink);
  white-space:pre;overflow-x:auto}
/* 設備の1行。押すと中身が出る */
.eqh{display:flex;align-items:center;gap:10px;width:100%;padding:12px 2px;border:0;
  background:none;cursor:pointer;text-align:left;min-height:48px}
.eqh .k{font-weight:700;font-size:14.5px;color:var(--ink);flex:none}
.eqh .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:0}
.eqh .c{font-size:16px;color:var(--ink-3);width:18px;text-align:center;flex:none}
.line.fold{padding:0 12px}
/* 畳めるひとかたまり。押すと開く */
.sec{overflow:hidden}
.sech{display:flex;align-items:center;gap:10px;width:100%;padding:15px 16px;border:0;
  background:var(--surface);cursor:pointer;text-align:left;min-height:54px}
.sech .t{font-family:"Zen Kaku Gothic New",sans-serif;font-size:15.5px;font-weight:700;color:var(--ink)}
.sech .n{font-size:12px;color:var(--ink-3);margin-left:auto}
.sech .c{font-size:17px;color:var(--ink-3);width:20px;text-align:center;flex:none}
.sec.open .sech{border-bottom:1px solid var(--line-soft)}
.sec.open .sech .c{color:var(--accent)}
.sec .card-b{padding-top:14px}
.acgrid{display:flex;flex-direction:column;gap:1px}
.acrow{display:flex;align-items:center;gap:8px;padding:7px 2px;
  border-bottom:1px solid var(--line-soft)}
.acrow:last-child{border-bottom:0}
.acrow .p{flex:1;font-size:14px;color:var(--ink-2);min-width:0}
.acrow.on .p{color:var(--ink);font-weight:700}
.acrow .n{width:2.2em;text-align:center;font-size:16px;font-weight:700;
  color:var(--ink-3);font-variant-numeric:tabular-nums}
.acrow.on .n{color:var(--ink)}
.acb{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;flex:none}
.acb:disabled{color:var(--line);cursor:default}
.acrow.on .acb{border-color:var(--accent);color:var(--accent)}

.ackind{padding:2px 0 10px 2px;display:flex;flex-direction:column;gap:4px;
  border-bottom:1px solid var(--line-soft);margin-bottom:2px}
.acrow{border-bottom:0}
.voicebar{display:flex;align-items:center;gap:12px;width:100%;margin:2px 0 10px;
  padding:13px 15px;border-radius:12px;border:2px solid var(--accent);
  background:var(--surface);cursor:pointer;text-align:left;min-height:62px}
.voicebar .mic{color:var(--crit);font-size:15px;line-height:1;flex:none}
.voicebar .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.voicebar b{font-size:15px;font-weight:700;color:var(--ink)}
.voicebar small{font-size:12px;color:var(--ink-2);line-height:1.5}
.voicebar.on{border-color:var(--crit);background:var(--crit-soft)}
.voicebar.on .mic{animation:pulse 1.4s infinite}

/* 項目ごとの声。丸だけだと何のボタンか分からないので、文字を付ける */
.micbtn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;
  border-radius:999px;border:1.5px solid var(--accent);background:var(--accent-soft);
  color:var(--accent);font-size:12.5px;font-weight:700;line-height:1;cursor:pointer;
  flex:none;margin-left:auto}
.micbtn .d{color:var(--crit);font-size:10px}
.micbtn.on{background:var(--crit);border-color:var(--crit);color:#fff}
.micbtn.on .d{color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.impbox.live{border-color:var(--crit)}
.imprest .live{color:var(--crit);font-weight:700;display:flex;align-items:center;gap:5px}
.imprest .live .mic{animation:pulse 1.4s infinite}
.impbox{background:var(--sunken);border:1px solid var(--line);border-radius:11px;
  padding:12px;margin:10px 0}
.impbox textarea{min-height:132px;background:var(--surface);font-size:16px;line-height:1.7}
.impbox .pkh b.ok{display:inline;color:var(--ok);font-family:inherit;font-size:inherit}
.imprest{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.imprest .ok{font-size:12px;color:var(--ok);font-weight:700;margin-right:auto}
.imprest .btn{width:auto;flex:none}
.impres{margin-top:9px}
.imph{font-size:11px;letter-spacing:.06em;color:var(--accent);font-weight:700;margin:8px 0 4px}
.imph.bad{color:var(--crit)}
.impline{display:flex;gap:9px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);
  font-size:12.5px}
.impline b{flex:none;font-size:12.5px}
.impline span{color:var(--ink-2)}
.impline.bad span{color:var(--crit)}
/* 声のボタン */
.btn.voice{display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--crit);border-color:var(--crit);color:#fff;font-size:16px;
  padding:14px;margin-bottom:12px;line-height:1.35}
.btn.voice small{display:block;font-size:10.5px;font-weight:400;opacity:.85;margin-top:1px}
.btn.voice .mic{font-size:11px;line-height:1}
/* 問診票の一行 */
.plab.wide{width:78px;font-size:11px;color:var(--ink-2);font-weight:700;padding-top:7px}
.pickrow.todo .plab.wide{color:var(--crit)}
.dimin{flex:0 0 118px;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:6px 8px;font-size:16px}
/* 工事のくくり（パック） */
.line.pack{border-color:var(--accent)}
.pkbox{background:var(--sunken);border-radius:9px;padding:11px;margin-top:9px}
.pkh{font-size:11.5px;color:var(--ink-2);line-height:1.7;margin-bottom:3px;position:relative}
.pkh b{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:14px;color:var(--ink)}
.pkcnt{position:absolute;right:0;top:0;font-family:"Roboto Mono",monospace;
  font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:1px 10px}
.pkbox textarea{margin-top:7px;min-height:46px}
.pkrow{display:grid;grid-template-columns:30px 1fr 58px 34px;gap:7px;align-items:center;
  padding:7px 0;border-top:1px solid var(--line)}
.pkrow:first-of-type{border-top:none}
.pkchk{width:26px;height:26px;border:2px solid var(--line);border-radius:7px;background:var(--surface);
  color:var(--accent-ink);font-size:14px;font-weight:700;cursor:pointer;padding:0;line-height:1}
.pkrow.on .pkchk{background:var(--accent);border-color:var(--accent)}
.pkn b{display:block;font-size:13.5px;font-weight:700;line-height:1.45}
.pkn span{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.pkrow:not(.on){opacity:.45}
.pkrow input.num{text-align:right;padding:6px;font-size:16px}
.pku{font-size:11px;color:var(--ink-3)}
.pkadd{background:var(--accent)!important;color:var(--accent-ink)!important;
  border-color:var(--accent)!important;font-weight:700}
.pkadd .n{display:block;font-size:9.5px;font-weight:400;opacity:.85}
/* 交換する現物の仕様。行のすぐ下にぶら下げる */
.eqbox{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;margin:2px 0 9px}
.eqbox.miss{border-color:var(--crit);background:var(--crit-soft)}
.eqh{font-size:11.5px;color:var(--ink-2);line-height:1.7;margin-bottom:7px}
.eqh b{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:13.5px;color:var(--ink)}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.eqchips{margin-top:8px}
.eqchips button{font-size:11.5px;padding:5px 10px}
.eqbox textarea{margin-top:8px;min-height:46px;font-size:16px}
.eqnote{margin-top:8px;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.7;
  background:var(--surface-2);border:1px solid var(--line-soft);color:var(--ink-2)}
.eqnote b{color:var(--ink);font-weight:700}
.eqwarn{margin-top:8px;font-size:11.5px;color:var(--crit);font-weight:700;line-height:1.65}
.eqwarn[hidden]{display:none}
@media (max-width:480px){ .eqgrid{grid-template-columns:1fr} }
.matbox{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.matbox[hidden]{display:none}
.math{font-size:10.5px;color:var(--ink-3);margin-bottom:5px}
.matopt{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;margin-bottom:4px;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;cursor:pointer}
.matopt b{font-size:12.5px;color:var(--ink)}
.matopt span{font-size:12px;color:var(--ink-2);font-family:"Roboto Mono",monospace}
.matopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.matopt[aria-pressed="true"] b{color:var(--accent)}
.matopt.ng{opacity:.6;cursor:default;border-style:dashed}
.matopt.ng span{color:var(--crit)}
.math.warn{color:var(--crit);font-weight:700}
.tileres{background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tileres>b{font-size:19px;color:var(--amber);font-family:"Roboto Mono",monospace}
.tileres span{font-size:11px;color:var(--ink-2);line-height:1.6}
.tileres span b{color:var(--ink)}
.lossw{float:right;display:inline-flex;gap:3px;align-items:center}
.lossb{border:1px solid var(--line);background:var(--surface);border-radius:5px;
  padding:2px 6px;font-size:10px;color:var(--ink-3);cursor:pointer}
.lossb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:700}
.hrow button:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:480px){ .hrow button{padding:10px 0;font-size:14.5px} .hrow{gap:3px} }
/* 行ごとの壁／天井。既定は壁で色が付いていて、天井のときだけ押す */
.pt{display:flex;gap:2px}
.pt button{flex:1;font-size:11.5px;padding:0;height:41px;border:1px solid var(--line);background:var(--surface);
  border-radius:5px;color:var(--ink-3);cursor:pointer;line-height:1.2}
.pt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:700}
.padwho{font-size:11.5px;color:var(--ink-2);margin-bottom:6px;display:flex;flex-wrap:wrap;
  gap:0 4px;align-items:center;line-height:1.6}
.padwho b{color:var(--ink);font-size:13px}
.padwho .pin{color:var(--accent);font-size:9px}
.padwho .ptag{background:var(--accent);color:var(--accent-ink);border-radius:4px;
  padding:1px 6px;font-size:10.5px;font-weight:700}
.padwho .mode{color:var(--ink-3);font-family:"Roboto Mono",monospace;font-size:10.5px}
.rtotal{text-align:right;font-size:13px;color:var(--ink-2);margin-top:7px;padding-top:6px;border-top:1px solid var(--line)}
.rtotal b{font-size:17px;color:var(--amber);margin:0 3px}
@media (max-width:480px){
  .rows{padding:5px}
  .rhead,.rrow{grid-template-columns:var(--gcs,var(--gc));gap:4px}
  .rrow input{padding:6px 4px;font-size:16px}
  .pt button{font-size:11px;padding:0;height:40px}
}
/* クロス・床の計測 */
.measbox{background:var(--sunken);border-radius:8px;padding:10px;margin-top:9px}
.meas{display:grid;grid-template-columns:1fr 1fr 62px 30px;gap:6px;align-items:center;margin-bottom:5px}
.meas input{padding:7px 6px;font-size:16px;text-align:right}
.meas .o{text-align:right;font-size:13.5px;color:var(--amber)}
.meas .d{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:16px;padding:0}
.measbox .h{display:grid;grid-template-columns:1fr 1fr 62px 30px;gap:6px;font-size:10px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:5px}
.measbox .h span:nth-child(-n+3){text-align:right;padding-right:3px}

.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:9px;margin:12px 0}
.tabs button{flex:1;background:none;border:none;padding:8px 2px;border-radius:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabbadge{display:inline-block;background:var(--crit);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;margin-left:2px;vertical-align:1px}

.helpbtn{background:var(--accent-soft);color:var(--accent);border:none;border-radius:999px;width:24px;height:24px;font-weight:700;cursor:pointer;font-size:13px;flex:none;line-height:1}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer[open]{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(10,16,20,.5)}
.drawer .panel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--surface);
  border-radius:16px 16px 0 0;padding:16px 14px 26px;max-width:580px;margin:0 auto;border-top:3px solid var(--accent)}
.drawer h3{margin:0 0 2px;font-size:17px}
.drawer .src{font-size:11px;color:var(--ink-3);margin-bottom:12px}
.drawer section{margin-bottom:14px}
.drawer section h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;color:var(--accent);font-family:"Zen Kaku Gothic New",sans-serif}
.drawer section p{margin:0;font-size:14px;line-height:1.85;white-space:pre-wrap}

/* 撮影ポイント */
.shout{background:var(--crit-soft);border:2px solid var(--crit);border-radius:11px;padding:13px 15px;margin-bottom:14px}
.shout.ok{background:var(--amber-soft);border-color:var(--amber)}
.shout-h{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:17px;color:var(--crit);margin-bottom:5px}
.shout.ok .shout-h{color:var(--amber)}
.shout-h b{font-size:19px}
.shout-b{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.shout-b b{color:var(--ink)}
.shot{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;cursor:pointer;border-top:1px solid var(--line);font-size:14.5px;line-height:1.6}
.shot:first-of-type{border-top:none}
.shot input{width:auto;flex:none;margin-top:4px;transform:scale(1.25)}
.shot.on span{color:var(--ink-3);text-decoration:line-through}
details.fix{margin-top:9px;border:1px solid var(--line);border-radius:8px;background:var(--sunken)}
details.fix summary{cursor:pointer;padding:8px 11px;font-size:12.5px;font-weight:700;color:var(--accent);font-family:"Zen Kaku Gothic New",sans-serif;list-style-position:inside}
details.fix p{margin:0;padding:0 12px 11px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--ink-2)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.est{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
table.est th,table.est td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
table.est th{background:var(--surface-2);font-size:10px;letter-spacing:.06em;color:var(--ink-2)}
table.est td.r,table.est th.r{text-align:right}
table.est tr:last-child td{border-bottom:none}
table.est td.nm{white-space:normal;min-width:150px}
table.est tbody tr.grp td{background:var(--sunken);font-weight:700;font-size:11.5px;letter-spacing:.04em}

.calc{background:var(--amber-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.calcrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0;font-size:13px}
.calcrow .k{color:var(--ink-2)}
.calcrow .v{font-weight:500}
.calcrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:16px}
.calcrow.total .v{color:var(--amber)}
.formula{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(24,34,43,.07)}
.dock-in{max-width:580px;margin:0 auto;padding:9px 14px;display:flex;gap:6px;align-items:center}
.stat{flex:1;min-width:0}
.stat .k{font-size:9.5px;letter-spacing:.09em;color:var(--ink-3);display:block}
.stat .v{font-size:16px;font-weight:500;display:block;line-height:1.3}
.stat .v small{font-size:10px;color:var(--ink-3);font-weight:400;margin-left:1px}
.stat.hi .v{color:var(--amber)}
.stat.warn .v{color:var(--crit)}
.dock .sep{width:1px;align-self:stretch;background:var(--line);flex:none}
.dockcta{background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
.dockcta:hover{filter:brightness(1.09)}
.dockcta small{display:block;font-size:9.5px;font-weight:400;opacity:.85}
.dockcta.back{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}

.empty{text-align:center;color:var(--ink-3);padding:24px 16px;font-size:13.5px}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.ok{background:var(--amber-soft);color:var(--amber)}
.dockcta.crit{background:var(--crit);color:#fff}
.difbox{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.difh{background:var(--surface-2);padding:7px 10px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.difrow{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:flex-start}
.difrow:first-child{border-top:none}
.difh + .difrow{border-top:none}
.dtag{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;line-height:1.5}
.dtag.add{background:var(--accent-soft);color:var(--accent)}
.dtag.del{background:var(--crit-soft);color:var(--crit)}
.dtag.chg{background:var(--amber-soft);color:var(--amber)}
.dbody{min-width:0;font-size:12px;display:flex;flex-wrap:wrap;gap:3px 6px;align-items:baseline;line-height:1.6}
.dbody b{flex-basis:100%;font-size:12.5px;color:var(--ink)}

/** 間取りから部屋を組み立てる。営業はここから足し引きするだけで済む */
function roomsFor(m){
  if(!m) return ["玄関","居室","キッチン","浴室","洗面室","トイレ"];
  if(m==="1R") return ["玄関","居室","浴室・洗面","トイレ"];
  var n=parseInt(m,10)||1;
  var t=m.replace(/^\d+/,"").replace("以上","");
  if(m==="5LDK以上"){ n=5; t="LDK"; }
  var r=["玄関"];
  if(t.indexOf("L")>=0||n>=2) r.push("廊下");
  if(t==="LDK") r.push("LDK");
  else if(t==="DK") r.push("DK");
  else r.push("キッチン");
  for(var i=1;i<=n;i++) r.push("洋室"+i);
  r.push("浴室","洗面室","トイレ");
  if(n>=2) r.push("収納");
  return r;
}
/* メゾネットは階段があり、そこもクロスを張るので部屋の並びに入れる */
function roomsForJob(j){
  var r=roomsFor(j.madori);
  if((j.mflags||[]).indexOf("メゾネット")>=0 && r.indexOf("階段")<0){
    var at=r.indexOf("廊下");
    r.splice(at>=0?at+1:1, 0, "階段");
  }
  return r;
}

/* 現場で癖のように出る言葉。見積の紙には書かれないので実績から拾えない。

   これが無いと職人は物を選べない。直前の行の規格・仕様に足す */
var ATTR = [
  /* 見切り金物の形。CFやクッションフロアを張ると段差（チリ）が出る */
  "への字","へ型","ヘ型","エル型","L型","ティー型","T型","フラット",
  "ノンスリップ","段差見切り","見切り","チリ","チリ有","チリ無",

  "シルバー","ブロンズ","ゴールド","シャンパンゴールド","ステンカラー",
  "ホワイト","白","アイボリー","ベージュ","ブラウン","こげ茶","茶",
  "グレー","ブラック","黒","クリア","透明","木目","ナチュラル",
  /* コーキングの打ち方と性能 */
  "コの字","ロの字","一本引き","打ち替え","増し打ち","三面","二面",
  "変成シリコン","シリコン","ウレタン","防カビ","防水","抗菌","防臭","耐水",
  /* 付き方の呼び分け。物そのものの名前はここに入れない（工事として拾う） */
  "壁付","台付","据置","壁掛け","天井カセット","天井埋込","床置き","窓用",
  "マルチ室内機","マルチ","自動洗浄あり","自動洗浄なし","露出","隠ぺい"
];
var ATTR_RE = new RegExp("^(?:" + ATTR.join("|") + ")$");
/* 間取りは数字が入るが、数量ではない。ルームクリーニングの規格・仕様になる */
var MADORI_RE = /^([1-9１-９]\s*(?:R|K|DK|LDK|SLDK|SDK))$|^(ワンルーム|ワンK)$/i;
/* その行が、属性の言葉だけでできているか。
   「への字シルバー」「への字 シルバー」「への字のシルバー」どれも拾う */
function attrOnly(t){
  var s2 = String(t||"").replace(/[。、,]/g,"").trim();
  if(!s2 || /[0-9０-９]/.test(s2)) return null;
  /* 「への字」「コの字」の "の" で割ってはいけない。空白だけで割る */
  var toks = s2.split(/[\s　]+/).filter(function(x){ return x; });
  if(!toks.length || toks.length > 5) return null;
  var got = [];
  for(var i=0;i<toks.length;i++){
    var w = toks[i];
    if(ATTR_RE.test(w)){ got.push(w); continue; }
    /* くっついて聞こえた分を切り分ける */
    var rest = w, part = [];
    while(rest){
      var hit = null;
      for(var k=0;k<ATTR.length;k++)
        if(rest.indexOf(ATTR[k])===0 && (!hit || ATTR[k].length>hit.length)) hit=ATTR[k];
      if(!hit) return null;
      part.push(hit); rest = rest.slice(hit.length);
    }
    got = got.concat(part);
  }
  return got.length ? got.join(" ") : null;
}
/* 規格・仕様に足す。同じ言葉は重ねない */
function addSpec(row, add){
  if(!row || !add) return "";
  var cur = String(row.spec||"");
  add.split(" ").forEach(function(w){
    if(w && cur.indexOf(w)<0) cur = (cur ? cur+" " : "") + w;
  });
  row.spec = cur;
  return cur;
}

/* 言いよどみ。意味を持たないので落とす */
var FILLER=/(^|[\s　])(あー*っと|えー*っと|えっと|あの+ー*|そのー*|あー+|えー+|おー+|うーん*|んー+|まぁ+|まあ|なんか|ちょっと|とりあえず|はいはい)(?=[\s　]|$)/g;
/* 迷いの言葉。これは捨てずに、あとで確認することとして立てる */
var DOUBT=/(かな|かなあ|だろう|どっち|かも|たぶん|多分|わからない|分からない|不明|要確認|後で確認|あとで確認|[?？])/;

/* 2つの語がどれだけ違うか。短い語ほど厳しく見る */
function editDist(a,b){
  var m=a.length,k=b.length,i,jj,prev,tmp,d=[];
  for(i=0;i<=k;i++) d[i]=i;
  for(i=1;i<=m;i++){
    prev=d[0]; d[0]=i;
    for(jj=1;jj<=k;jj++){
      tmp=d[jj];
      d[jj]=Math.min(d[jj]+1, d[jj-1]+1, prev+(a.charAt(i-1)===b.charAt(jj-1)?0:1));
      prev=tmp;
    }
  }
  return d[k];
}
/* 崩れた語を、一番近い現調の言葉へ寄せる。寄せたものは記録して、あとで見せる */
var SAY_LOG=[];
/* いま開いている工種の言葉。候補が10語なら、多少崩れても当たる。
   1,100語ぜんぶから探すより、ここを先に見るほうが取り違えない */
function nearWords(cat){
  var a=[];
  if(cat && KOUSHU[cat]){
    a.push(cat);
    KOUSHU[cat].i.forEach(function(it){ a.push(it[0]); });
  }
  for(var k in PACKS) if(!cat || PACKS[k].cat===cat) a.push(k);
  return a.concat(VOCAB_SRC.place||[]);
}
function nearest(w,list,lim){
  var best=null, bd=99;
  for(var i=0;i<list.length;i++){
    var v=list[i];
    if(!v || Math.abs(v.length-w.length)>2) continue;
    var d=editDist(w,v);
    if(d<bd){ bd=d; best=v; }
  }
  return (best && bd<=lim && bd>0) ? best : null;
}
/* 「エアコン」は語彙に単独では無いが、「エアコン交換」の一部として在る。
   こういう言葉を、似た別の語へ寄せてはいけない（エアコン→エアコン面 のような事故） */
function known(w){
  for(var i=0;i<VOCAB.length;i++) if(VOCAB[i].indexOf(w)>=0) return true;
  return false;
}
function snapWord(w){
  if(!w || w.length<3) return w;
  if(known(w)) return w;
  /* 長い語ほど1〜2文字の違いは許す。短い語は取り違えるので厳しく */
  var lim = w.length>=6 ? 2 : (w.length>=4 ? 1 : 0);
  /* まず、いま見ている工種の言葉。次に、実績ぜんぶ */
  var hit = nearest(w, nearWords(V.cat), lim) || nearest(w, VOCAB, lim);
  if(hit){ SAY_LOG.push(w+"→"+hit); return hit; }
  return w;
}
function snapAll(t){
  /* ひらがなで繋げてしまうと文がまるごと1語になる。
     カタカナ・漢字・英字の並びを、それぞれ別の語として寄せる */
  return String(t||"")
    .replace(/[ァ-ヶー]{3,}/g, snapWord)
    .replace(/[一-龠]{2,}/g, snapWord)
    .replace(/[A-Za-zＡ-Ｚａ-ｚ]{2,}/g, snapWord);
}
function sayNorm(t){
  t=String(t||"")
    .replace(/[０-９]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); })
    .replace(/[．。]/g,".")
    .replace(/[，、]/g," ")
    .replace(/点(?=\d)/g,".")
    .replace(/[ 　\t]+/g," ");
  SAY_FIX.forEach(function(f){ t=t.replace(f[0],f[1]); });
  /* 言いよどみを落としてから、語を寄せる */
  t=t.replace(FILLER,"$1").replace(/[ 　]+/g," ").trim();
  t=snapAll(t);
  return t;
}
/* 1行を読む。読めなければ null を返し、あとで見せる */
/* 行から工事名や壁・天井を抜いて、残ったものを場所とみなす */
function sayPlace(t,upto){
  var head = t.slice(0,upto).replace(/天井|壁面|壁/g,"")
    .replace(/クロス張替え|クロス|CF張り|CF|長尺シート|タイルカーペット|フロアタイル|カーペット|ソフト巾木張替え|ソフト巾木|巾木|フローリング|床|畳|襖|障子|網戸|ルームクリーニング|クリーニング|エアコン内部洗浄|エアコン/g,"")
    .replace(/\s+/g," ").trim()
    .replace(/^[のはをがにでとも、,]+/,"")
    .replace(/[のはをがにでとも、,]+$/,"")
    .trim();
  /* 残りが2語以上あるときは、場所らしい語だけ残す。
     聞き違えた工事名が場所欄に流れ込むのを止める */
  var toks=head.split(" ").filter(function(x){return x;});
  if(toks.length>1){
    var keep=toks.map(placeToken).filter(function(x){return x;});
    if(keep.length) return keep.join(" ");
  }
  /* 場所として残ったのが数字だけなら、場所は無かったことにする。
     数字が場所欄に入るくらいなら、空のほうがいい */
  if(/^[0-9０-９.．,、\s]*$/.test(head)) return "";
  return head;
}
/* その語は場所か。「洋室1」は洋室の続き。「ゲンカン」は玄関に寄せる */
function placeToken(w){
  if(!w) return null;
  /* 数字だけの言葉は場所ではない。「2.5」が場所に入っていた */
  if(/^[0-9０-９.．,、]+$/.test(w)) return null;
  var pl=VOCAB_SRC.place||[];
  for(var i=0;i<pl.length;i++) if(pl[i].length>=2 && w.indexOf(pl[i])===0) return w;
  var lim = w.length>=6 ? 2 : (w.length>=4 ? 1 : 0);
  return nearest(w, pl, lim);
}
/* 文のどこにあっても寸法の形を見つける。人に区切らせない。
   「玄関壁2.4が3本廊下壁2.4が2本」を2つに割る */
var MEAS_G = /(\d+(?:\.\d+)?)\s*(?:が|かける|×|x|X|\*|の)\s*(\d+(?:\.\d+)?)\s*(本|枚|箇所|か所|カ所|ヶ所)?/g;
var QTY_G  = /(\d+(?:\.\d+)?)\s*(枚|本|個|台|箇所|か所|カ所|ヶ所|セット|式|㎡|平米|帖|畳|m|ｍ|メートル)(?![\d０-９])/g;
function sayScan(text){
  var t=String(text||"");
  var hits=[];
  MEAS_G.lastIndex=0;
  var m;
  while((m=MEAS_G.exec(t))){ hits.push({s:m.index, e:m.index+m[0].length, kind:"hw", a:m[1], b:m[2]}); }
  QTY_G.lastIndex=0;
  while((m=QTY_G.exec(t))){
    var s2=m.index, e2=m.index+m[0].length, dup=false;
    /* 掛け算の一部を、別の数として二重に拾わない */
    for(var i=0;i<hits.length;i++) if(!(e2<=hits[i].s || s2>=hits[i].e)) dup=true;
    if(!dup) hits.push({s:s2, e:e2, kind:"q", a:m[1], u:m[2]});
  }
  hits.sort(function(x,y){ return x.s-y.s; });
  return hits;
}
function sayRow(line){
  var t=sayNorm(line).trim(); if(!t) return null;
  var part = /天井/.test(t) ? "天井" : (/壁/.test(t) ? "壁" : null);
  /* 「2.4が3本」「2.6かける3.5」——掛け合わせて面積・本数になるもの */
  var m=t.match(/(\d+(?:\.\d+)?)\s*(?:が|かける|×|x|X|\*|の)\s*(\d+(?:\.\d+)?)/);
  if(m) return {place:sayPlace(t,m.index), part:part, h:m[1], n:m[2],
                raw:line.trim(), all:t};
  /* 「玄関 12枚」「鍵 1本」——数を1つだけ言う行。巾木も鍵も電球もこう言う */
  var q=t.match(/(\d+(?:\.\d+)?)\s*(枚|本|個|台|箇所|か所|カ所|ヶ所|セット|式|㎡|平米|m|ｍ|メートル)(?![\d０-９])/);
  if(q) return {place:sayPlace(t,q.index), part:part, qty:q[1], unit:q[2],
                raw:line.trim(), all:t};
  return null;
}
/* その項目の単位。式・台・箇所なら、名前を言うだけで1つ分になる */
function unitOf(cat,name){
  var list=(KOUSHU[cat]||{}).i||[];
  for(var i=0;i<list.length;i++) if(list[i][0]===name) return list[i][1];
  return "";
}
/* 数を言わなかった工事を、1つ分の行にする。
   名前のあとに残った言葉（4LDK、白、防カビ）は規格・仕様に回す */
function sayOne(cat,name,t){
  if(!name) return null;
  var u=unitOf(cat,name);
  if(!/式|台|箇所|セット|個|回|人工|日/.test(u)) return null;
  var rest=String(t||"").split(name).join(" ");
  var st=itemStem(name);
  if(st && st.length>=2) rest=rest.split(st).join(" ");
  rest=rest.replace(/[\s　]+/g," ").trim();
  var sp="";
  if(rest){
    var mm=rest.match(MADORI_RE);
    if(mm) sp=mm[0].replace(/\s/g,"").toUpperCase();
    else { var aa=attrOnly(rest); sp = aa || (rest.length<=14 ? rest : ""); }
  }
  return {place:"", qty:1, unit:u, addSpec:sp, one:true};
}
/* その工種の項目名を、そのまま言ったときだけ拾う。
   「壁」「天井」のような手がかりでは動かさない */
function sayItemExact(cat,t){
  var list=(KOUSHU[cat]||{}).i||[], hit=null;
  for(var i=0;i<list.length;i++)
    if(t.indexOf(list[i][0])>=0 && (!hit||list[i][0].length>hit.length)) hit=list[i][0];
  return hit;
}
/* その行がどの項目のものか。書いていなければ、直前の項目を引き継ぐ */
function sayItem(cat,t){
  var list=(KOUSHU[cat]||{}).i||[];
  for(var i=0;i<list.length;i++) if(t.indexOf(list[i][0])>=0) return list[i][0];
  if(/CF|クッションフロア/.test(t)) return "CF張り";
  if(/クロス|壁紙|クロース|壁貼|天井|壁/.test(t)) return "クロス張替え";
  if(/長尺/.test(t))                 return "長尺シート";
  if(/タイルカーペット/.test(t))     return "タイルカーペット";
  if(/フロアタイル/.test(t))         return "フロアタイル張り";
  if(/巾木/.test(t))                 return "ソフト巾木張替え";
  return null;
}
/* 貼られた文をまるごと読む */
function sayParse(cat,text,fixed){
  var lines=String(text||"").split(/[\n\r]+/);
  var out=[], bad=[], doubt=[], cur=fixed||null;
  SAY_LOG=[];
  lines.forEach(function(L){
    if(!L.trim()) return;
    var t=sayNorm(L);
    /* 「120かな125かな、どっちだろう」——現場で迷ったことは情報。
       捨てずに、あとで確認することとして立てる */
    if(DOUBT.test(t)){ doubt.push(t); return; }
    /* 項目を開いて喋っているときは、工事名を言わなくていい。
       別の工事名をはっきり言ったときだけ、そちらへ移る。
       「壁」「天井」だけでクロスに化けさせない */
    var nm = fixed ? sayItemExact(cat,t) : sayItem(cat,t);
    if(nm) cur=nm;
    /* 続けて喋られた文には、寸法がいくつも入っている。全部拾う */
    var hits=sayScan(t);
    if(hits.length>1){
      var prev=0;
      hits.forEach(function(hh){
        var seg=t.slice(prev, hh.e); prev=hh.e;
        var rr=sayRow(seg);
        if(!rr) return;
        var nm2 = fixed ? sayItemExact(cat,seg) : sayItem(cat,seg);
        if(nm2) cur=nm2;
        rr.item=cur||fixed||sayItem(cat,seg)||"クロス張替え";
        out.push(rr);
      });
      /* 最後の寸法より後ろに残った言葉（への字 シルバー など） */
      var tailTxt=t.slice(prev).trim();
      if(tailTxt){
        var at2=attrOnly(tailTxt);
        if(at2 && out.length) out[out.length-1].addSpec=at2;
      }
      if(out.length) return;
    }
    var r=sayRow(L);
    /* 「への字 シルバー」——数字は無いが捨てない。直前の行の規格・仕様になる */
    if(!r){
      var at=attrOnly(t);
      if(at && out.length){ out[out.length-1].addSpec=at; return; }
      /* 「ルームクリーニング 4LDK」——数を言わない工事がある。
         式・台・箇所で数えるものは、名前を言った時点で1つ分 */
      var one=sayOne(cat, nm||cur, t);
      if(one){ one.item = nm||cur; cur = one.item; out.push(one); return; }
      bad.push(t.trim()); return;
    }
    r.item=cur||fixed||sayItem(cat,t)||"クロス張替え";
    out.push(r);
  });
  return {rows:out, bad:bad, doubt:doubt, fixed:SAY_LOG.slice()};
}
/* ==================== 歩く ====================
   工種も項目も選ばせない。喋った順に積み上げる。
   部屋の名前を言えば場所が変わり、工事名を言えば工種が変わる。 */

/* 入ってすぐ聞くこと。質問ではなく、空欄が置いてあるだけ */
function walkHead(j){
  return [
    {k:"breaker", l:"ブレーカー", v:j.breaker||"",
     say:"「ブレーカー上げた」"},
    {k:"power",   l:"通電",       v:j.power||"",
     say:"「電気きてる」「通電なし」"},
    {k:"ac",      l:"エアコン",
     v:acTotal(j) ? acList(j).map(function(x){

     say:"「洋室1にエアコン1台」"}
  ];
}
/* 帰る前に確かめること。基本情報の「鍵の場所」と同じものを見る。
   先に書いてあれば、ここは最初から埋まっている */
function walkTail(j){

           say:"「鍵はメーターボックスの中」"}];
}
/* 部屋の名前だけを言った行か。言ったならその名前を返す */
/* 「洋室1」「洋室いち」も部屋。数字が入るからといって弾かない */
var KANSUJI={"一":"1","二":"2","三":"3","四":"4","五":"5",
             "いち":"1","に":"2","さん":"3","よん":"4","ご":"5"};
function walkPlaceOnly(j,t){
  var s2=String(t||"").replace(/[\s　のはをがにでとも、,。]/g,"");
  if(!s2) return null;
  /* 「洋室いち」「洋室二」を「洋室1」「洋室2」に寄せる */
  s2=s2.replace(/(洋室|和室|居室|トイレ|収納|浴室)(一|二|三|四|五|いち|に|さん|よん|ご)$/,
                function(m,a,b){ return a+KANSUJI[b]; });
  var best=null;
  (j.rooms||[]).forEach(function(rm){
    var r2=rm.replace(/[\s　]/g,"");
    if(s2===r2) best=rm;
  });
  if(best) return best;
  /* 部屋の名でなければ、数字を含む行は寸法の行。場所ではない */
  if(/\d/.test(s2)) return null;
  (j.rooms||[]).forEach(function(rm){
    var r2=rm.replace(/[\s　]/g,"").replace(/\d+$/,"");
    if(s2===r2) best=rm;
  });
  if(best) return best;
  var pl=VOCAB_SRC.place||[];
  for(var i=0;i<pl.length;i++) if(s2===pl[i]) return pl[i];
  var snapd=placeToken(s2);
  return (snapd&&snapd===s2)?snapd:null;

/* 入ってすぐの3つと、帰り際の1つ。喋れば埋まる */
function walkHeadHeard(j,t){
  var s2=String(t||"");
  if(/ブレーカー/.test(s2)){
    j.breaker = /上げられない|上がらない|落ちない|入らない/.test(s2) ? "上げられない"
              : /上がってた|上がっていた|もう上/.test(s2) ? "上がっていた" : "上げた";
    return "ブレーカー：" + j.breaker;
  }
  if(/通電|電気(は|が)?(きて|来て|ある|ない|無い)|電気なし|電源/.test(s2)){
    j.power = /なし|無い|ない|きてない|来てない|落ちて|止まって/.test(s2) ? "通電なし" : "通電あり";
    return "通電：" + j.power + (j.power==="通電なし" ? "　→ 通電依頼を立てました" : "");
  }
  var amp=s2.match(/(\d+)\s*(A|アンペア|ａ)/i);
  if(amp){ j.amp=(j.amp?j.amp+" ":"")+amp[1]+"A"; return "アンペア：" + j.amp; }
  var acm=s2.match(/エアコン[^0-9]{0,4}(\d+)\s*台?/);
  if(acm){
    /* 「洋室1にエアコン2台」——部屋を言っていればその部屋に、
       言っていなければ、いま歩いている部屋に */
    var rm=null;
    (j.rooms||[]).forEach(function(x){ if(s2.indexOf(x.replace(/\s/g,""))>=0) rm=x; });
    rm = rm || V.walkPlace;
    if(rm){
      var cc=acCell(j,rm); cc.n=+acm[1];
      /* 「洋室1にエアコン1台 天井カセット 自動洗浄あり」——種別も同じ息で言える */
      AC_KIND.concat(AC_WASH).forEach(function(k){
        if(s2.indexOf(k)>=0 && cc.t.indexOf(k)<0){
          var grp=(AC_KIND.indexOf(k)>=0)?AC_KIND:AC_WASH;
          cc.t=cc.t.filter(function(x){ return grp.indexOf(x)<0; });
          cc.t.push(k);
        }
      });
      acSet(j,rm,cc);
      return "エアコン：" + rm + " " + cc.n + "台"
        + (cc.t.length?"（"+cc.t.join("・")+"）":"")
        + "　合計" + acTotal(j) + "台";
    }
    return "どの部屋のエアコンか分かりません：" + s2;
  }
  if(/キーボックス|キーBOX|鍵箱|鍵は|鍵を/.test(s2)){
    var where=s2.replace(/.*(キーボックス|キーBOX|鍵箱|鍵)\s*(は|を|に)?/,"").trim();
    if(where){ j.key=where; return "鍵の場所：" + where; }
  }
  return null;
}
/* いま向いている工事項目の名前。項目を開いていなければ空 */
function impFixed(j){
  if(V.impItem==null || !j) return null;
  var it=(j.items||[])[V.impItem];

/* 溜まっている文を読み取って、読めた行を上に入れる。
   読めなかった行だけ窓に残す。声からも、貼り付けからも、ここを通る */
function flushImp(j){

/* 歩いているとき、喋った1行がどこへ行くかを決める。
   ここが「どこに情報が入るか」の心臓 */
function walkLine(j,raw){
  var t=sayNorm(raw); if(!t.trim()) return null;
  function note(kind,text){
    j.walk=j.walk||[];
    j.walk.push({at:new Date().toISOString(),text:text,kind:kind,raw:raw});
    return {kind:kind,text:text};
  }
  /* 迷ったことは捨てない。あとで確かめることとして立てる */
  if(DOUBT.test(t)){ sayDoubt(j,[t]); return note("doubt","要確認へ：" + t); }
  /* 入ってすぐの3つと、帰り際の1つ */
  var hd=walkHeadHeard(j,t);
  if(hd){ save(); return note("head",hd); }
  /* 「への字 シルバー」「白 防カビ」——直前に書いた行の仕様になる */
  var at=attrOnly(t);
  if(at){
    /* 「への字」「L型」は、床の仕様ではなく別の工事。
       ISSは見切り金物を1行として発注するので、そのまま行にする */
    if(/への字|へ型|ヘ型|エル型|L型|ティー型|T型|フラット|ノンスリップ|見切り|チリ/.test(at)
       && /CF|フロアタイル|長尺|カーペット|フローリング|床/.test(LAST_ROW_NAME||"")){
      var kr2=addKiri(j, at, V.walkPlace);
      save();
      return note("item", "見切り金物取付　" + (V.walkPlace||"") + "　" + (kr2.spec||""));
    }
    if(LAST_ROW){
      var sp=addSpec(LAST_ROW, at); save();
      return note("spec", LAST_ROW_NAME + "　" + sp);
    }
    return note("bad", "どの行のことか分かりません：" + t);
  }
  /* 部屋の名前だけを言った——ここから先はその部屋の話 */
  var pl=walkPlaceOnly(j,t);
  if(pl){ V.walkPlace=pl; return note("place",pl); }
  /* 工事の行。工種は言葉から決める。言っていなければ直前のまま */
  var cat=null, nm=sayItem2(t);
  if(nm){ cat=nm.cat; V.walkCat=nm.cat; V.walkItem=nm.name; }
  cat=cat||V.walkCat;
  if(!cat) return note("bad","工種が分かりませんでした：" + t);
  /* 言った工事名を、場所欄に流し込まない。
     「コーキング 1箇所」の場所は「コーキング」ではなく、いまいる部屋 */
  var t2=t;
  if(nm){
    t2=t2.split(nm.name).join(" ");
    var st2=itemStem(nm.name);
    if(st2.length>=2) t2=t2.split(st2).join(" ");
    t2=t2.replace(/\s{2,}/g," ").trim();
  }
  var pv=sayParse(cat, t2, V.walkItem);
  /* 続けて喋ったぶんは、まとめて何行にもなる */
  if(!pv.rows.length){
    /* 「クロス」「壁紙」だけ言った——数はまだ。工事だけ切り替えて、そう見せる。
       黙っていると、聞こえていないのか切り替わったのか分からない */
    if(nm) return note("item","ここから " + nm.name
      + (V.walkPlace ? "（" + V.walkPlace + "）" : ""));
    return note("bad","読み取れませんでした：" + t);
  }
  /* 間取りを言わなかったルームクリーニングは、基本情報の間取りを入れておく */
  pv.rows.forEach(function(r2){
    if(r2.one && !r2.addSpec && /クリーニング/.test(r2.item||"") && madoriText(j))
      r2.addSpec=madoriText(j);
  });
  /* 場所を言っていない行は、いまいる部屋のもの */
  pv.rows.forEach(function(r){ if(!r.place && V.walkPlace) r.place=V.walkPlace; });
  sayApply(j,cat,pv);
  var one=pv.rows[0];
  return note("row", (one.place||V.walkPlace||"") + "　" + one.item + "　"
    + (one.qty!=null ? one.qty+(one.unit||"") : (one.h||"")+"×"+(one.n||""))
    + (one.part?"（"+one.part+"）":""));
}
/* どの工種のどの項目か。工種をまたいで探す */
function itemStem(nm){
  return String(nm).replace(
    /(本体交換|張り替え|張替え|貼替え|上張り|取り付け|取替え|入替え|交換|張り|貼り|工事|清掃|洗浄|設置|取付|取替|補修|新設|撤去|処分|施工|作業|調整|打ち換え|打換え|入替)+$/,"");
}
function sayItem2(t){
  var hit=null;
  for(var c in KOUSHU){
    (KOUSHU[c].i||[]).forEach(function(x){
      if(t.indexOf(x[0])>=0 && (!hit||x[0].length>hit.name.length)) hit={cat:c,name:x[0]};
    });
  }
  if(hit) return hit;
  /* 現場は物の名前しか言わない。「コーキング」で「コーキング打ち換え」に当てる */
  for(var c3 in KOUSHU){
    (KOUSHU[c3].i||[]).forEach(function(x){
      var st=itemStem(x[0]);
      if(st.length>=3 && t.indexOf(st)>=0 && (!hit||st.length>itemStem(hit.name).length))
        hit={cat:c3,name:x[0]};
    });
  }
  if(hit) return hit;
  /* 名前をそのまま言わなかったとき。「クロス」「CF」などの手がかりで拾う */
  for(var c2 in KOUSHU){
    var n2=sayItem(c2,t);
    if(n2 && (KOUSHU[c2].i||[]).some(function(x){return x[0]===n2;})) return {cat:c2,name:n2};
  }
  return null;
}
/* 喋りっぱなしにする。区切りがついた文から順に、そのまま行になる。

function startDictate(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ walkFallback("この端末では声が使えません。打つ欄を開きました"); return; }
  stopDictate();
  var r=new SR();
  r.lang="ja-JP"; r.interimResults=false; r.continuous=true; r.maxAlternatives=1;
  r.onresult=function(e){
    var add="";
    for(var i=e.resultIndex;i<e.results.length;i++)
      if(e.results[i].isFinal) add+=e.results[i][0].transcript+"\n";
    if(!add) return;
    var jj=J(); if(!jj) return;
    /* 歩いているときは、1行ずつその場で行き先を決める */
    if(V.tab==="walk"&&V.view==="job"){
      add.split(SPLIT_LINES).forEach(function(L){ if(L.trim()) walkLine(jj,L); });
      save(); walkRepaint(jj); return;
    }
    V.impText=(V.impText||"")+add;
    /* 読み取れてもれなくても、聞こえた分は必ず画面に出す。
       黙っていると「声が反映しない」ように見える */
    if(!flushImp(jj)){ render(); toast("聞こえた分を窓に入れました"); }
  };
  r.onerror=function(e){
    /* 何も喋らなかっただけのときは、黙って掛け直す。いちいち知らせない */
    if(e.error==="no-speech"||e.error==="aborted") return;
    SAY_REC=null; SAY_WANT=false;
    walkFallback(e.error==="not-allowed"
      ? "ここではマイクが使えません。打つ欄を開きました"
      : "うまく聞き取れませんでした。打つ欄を開きました");
  };
  /* iPhoneは一言ごとに聞き取りを終わらせる。continuous を無視する端末がある。
     止めると言われるまで、こちらから掛け直す。押し直させない */
  r.onend=function(){
    if(SAY_REC!==r) return;
    if(SAY_WANT){
      try{ r.start(); return; }catch(e){}
      setTimeout(function(){
        if(!SAY_WANT || SAY_REC!==r) return;
        try{ r.start(); }catch(e){ SAY_REC=null; SAY_WANT=false; render(); }
      },220);
      return;
    }
    SAY_REC=null; render();
  };
  SAY_REC=r; SAY_WANT=true;
  try{ r.start(); toast("聞いています。押し直さなくて大丈夫です"); }
  catch(err){ SAY_REC=null; SAY_WANT=false; toast("いま聞き取りを始められません"); }
}
/* 声がだめでも行き止まりにしない。同じことを打てる欄をその場に開く。
   歩く画面でも、工種の画面でも、開く先は違うが考え方は同じ */

/* 何が起きたかを一息で伝える */
function sayMsg(pv){
  var a=[];
  if(pv.rows.length)  a.push(pv.rows.length+"行 書き留めました");
  if(pv.doubt.length) a.push("迷った"+pv.doubt.length+"件を要確認へ");
  if(pv.fixed.length) a.push("直し "+pv.fixed.slice(0,3).join("、"));
  if(pv.bad.length)   a.push("読めなかった"+pv.bad.length+"行は残しています");
  return a.join("　");
}
/* 見切り金物を足す。押しても、声でも、通る道は1本 */
function addKiri(j, spec, place){
  var ki=null;
  (j.items||[]).forEach(function(x){ if(x.name==="見切り金物取付") ki=x; });
  if(!ki){
    var kp=pick("雑工事","見切り金物取付");
    ki=newItem("雑工事",kp[0],kp[1],kp[2]); ki.rows=[]; j.items.push(ki);
  }
  var kr=ki.rows[ki.rows.length-1];
  /* 直前の行がまだ数量も入っていなければ、そこに足す。埋まっていれば行を足す */
  if(!kr || (kr.qty!=="" && kr.qty!=null)){
    kr=newRow(ki,kr); kr.qty=1; kr.place=place||""; ki.rows.push(kr);
  }
  if(place && !kr.place) kr.place=place;
  addSpec(kr, spec);
  LAST_ROW=kr; LAST_ROW_NAME=ki.name;
  delete j.sample;
  return kr;
}
/* いま最後に書いた行。属性の言葉は、ここに足す */
var LAST_ROW=null, LAST_ROW_NAME="";
/* 迷った内容を、要確認として残す */
function sayDoubt(j,list){
  j.issues=j.issues||[];
  list.forEach(function(d){
    j.issues.push({place:"", sym:d, spot:"", note:"現調中に迷ったこと（声から）", done:[]});
  });
  save();
}
/* 読み取った内容を、実際に行として入れる */
function sayApply(j,cat,parsed){
  var carry="";
  parsed.rows.forEach(function(r){
    var p=pick(cat,r.item); if(!p) return;
    var it=null;
    (j.items||[]).forEach(function(x){ if(x.cat===cat && x.name===p[0]) it=x; });
    if(!it){ it=newItem(cat,p[0],p[1],p[2]); it.rows=[]; j.items.push(it); }
    if(r.place) carry=r.place;
    var row=newRow(it, it.rows[it.rows.length-1]);
    row.place = r.place || carry;
    if(isCloth(it.name)) row.part = r.part || "壁";
    /* 掛け算で言った行は縦と横。数を1つだけ言った行はそのまま数量 */
    if(r.qty!=null){ row.qty=r.qty; delete row.h; delete row.n; }
    else { row.h=r.h; row.n=r.n; delete row.qty; }
    /* 数を言わなかった工事は、間取りが分かっていればそれを入れる */
    if(r.one && !r.addSpec && /クリーニング/.test(it.name) && madoriText(j))
      r.addSpec=madoriText(j);
    if(r.addSpec) addSpec(row, r.addSpec);
    it.rows.push(row);
    LAST_ROW=row; LAST_ROW_NAME=it.name;
  });
  delete j.sample; save();
}

/* 声で工事名を聞き取って、その問診票を開く。
   聞き取れなかったときは、聞こえた言葉をそのまま見せて、押して選んでもらう */
function sayMatch(text){
  var t=String(text||"").replace(/\s/g,"");
  for(var k in PACKS){
    var d=PACKS[k], words=(d.say||[]).concat([k]);
    for(var i=0;i<words.length;i++) if(t.indexOf(words[i])>=0) return {pack:k};
  }
  for(var c in KOUSHU){
    var its=KOUSHU[c].i;
    for(var m=0;m<its.length;m++) if(t.indexOf(its[m][0])>=0) return {cat:c, item:its[m][0]};
    if(t.indexOf(c)>=0) return {cat:c};
  }
  return null;
}
/* 聞き取れた言葉／打った言葉から先は、どちらも同じ道を通る */
function sayJump(j,hit,heard){
  if(!hit){ toast("「"+heard+"」は見つかりませんでした"); return false; }
  if(hit.pack){
    var np=newPack(hit.pack); if(!np) return false;
    j.items.push(np); delete j.sample; save();
    V.cat=np.cat; V.focus="it"+(j.items.length-1); V.saybox=false;
    toast(hit.pack+"を開きました");
    go("koushu", j.id, np.cat); return true;
  }
  V.cat=hit.cat; V.saybox=false;
  if(hit.item){
    var p=pick(hit.cat,hit.item), ex=null;
    (j.items||[]).forEach(function(x){ if(x.cat===hit.cat && x.name===p[0]) ex=x; });
    if(ex) ex.rows.push(newRow(ex,ex.rows[ex.rows.length-1]));
    else j.items.push(newItem(hit.cat,p[0],p[1],p[2]));
    delete j.sample; save();
    var si2=(j.items||[]).indexOf(ex||j.items[j.items.length-1]);
    V.focus="it"+si2;
    var sit=j.items[si2];
    if(sit && !isPack(sit)){
      if(!(sit.rows||[]).length) sit.rows=[newRow(sit,null)];
      V.arow=[si2, sit.rows.length-1]; V.afield="h"; save();
    }
    toast(p[0]+"を足しました");
  } else {
    toast(hit.cat+"を開きました");
  }
  go("koushu", j.id, hit.cat); return true;
}
/* 声が使えない場所がある。Artifactの枠の中や、PCのブラウザ。
   そこで黙って行き止まりにせず、同じことを打てる欄をその場で開く */
function sayFallback(why){
  V.saybox=true; render();
  var el=document.querySelector("[data-saybox]");
  if(el) el.focus();
  toast(why);
}
function startSay(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ sayFallback("この端末では声が使えません。打ってください"); return; }
  var j=J(); if(!j) return;
  var r=new SR();
  r.lang="ja-JP"; r.interimResults=false; r.maxAlternatives=3;
  toast("聞いています…　工事名を言ってください");
  r.onresult=function(e){
    var heard=[];
    for(var i=0;i<e.results[0].length;i++) heard.push(e.results[0][i].transcript);
    var hit=null;
    for(var k=0;k<heard.length && !hit;k++) hit=sayMatch(heard[k]);
    if(!hit){ V.sayText=heard[0]||""; sayFallback("「"+heard[0]+"」は見つかりませんでした。直してください"); return; }
    sayJump(j, hit, heard[0]);
  };
  r.onerror=function(e){
    sayFallback(e.error==="not-allowed"
      ? "ここではマイクが使えません。打ってください"
      : "うまく聞き取れませんでした。打ってください");
  };
  try{ r.start(); }catch(err){ sayFallback("いま声が使えません。打ってください"); }
}

/* ── 床材の材料取り ──────────────────────────────
   同じ「床を張る」でも、材料の買い方が3通りある。

   CF・長尺シート   幅1.8ｍのロール。部屋の方が広いので何本か継いで張る。
                    3.6×2.4なら、3.6に流して3.7ｍ×2本、2.4に流して2.5ｍ×2本。
   ロールカーペット 反幅3.6ｍ。たいてい1枚に収まるので、要る幅にカットして
                    「カット幅×長さ」の面積で発注する。2.4ｍの幅しか要らなければ
                    3.6ｍの製品を2.5ｍにカットする。
                    縦も横も3.6ｍを越える部屋は1枚で敷けないので継ぐ。
   タイルカーペット・フロアタイル
                    ケース売り。枚数で出しても発注に使えないので㎡だけ拾う。

   余裕（カットロス）は既定10cm。柄合わせや歪みが心配なときは20cmに変えられる。
   どちらの向きに流すかは毛並み・木目の見え方で現場が決めるので、両方出して選ばせる。 */
function matSpec(name){
  if(/タイルカーペット/.test(name))             return {type:"tile"};
  if(/フロアタイル|Pタイル|コルクタイル/.test(name)) return {type:"case"};
  if(/カーペット|じゅうたん|絨毯/.test(name))   return {type:"cut",  w:3.6};
  if(/CF|長尺シート/.test(name)) return {type:"roll", w:1.8};
  return null;
}
/* 問屋は長さ5ｍを超えると重すぎて出せないので、5ｍで切って継ぐことになる */
var CUT_MAX=5;
/* タイルカーペットは40cm角と50cm角が主流。一番長いところを測って、
   縦横それぞれ何列要るかを出し、掛ける。予備は1割見ておく。 */
var TILE_SIZES=[0.5,0.4];
function tilePlan(a,b,sz){
  var cols=Math.max(1,Math.ceil(a/sz-1e-9)), rows=Math.max(1,Math.ceil(b/sz-1e-9));
  var cnt=cols*rows;
  return {kind:"tile",size:sz,cols:cols,rows:rows,n:cnt,spare:Math.ceil(cnt*1.1)};
}
function isRoll(name){ return !!matSpec(name); }
function upcm(v){ return Math.ceil(Math.round(v*1000)/10)/100; }   // 1cm単位で切り上げ
function mfmt(v){ return fmt(v, (Math.round(v*100)%10)?2:1); }
function rollPlan(along,across,W,loss){        // 継いで張る
  var len=upcm(along+loss), cnt=Math.max(1,Math.ceil(across/W-1e-9));
  return {kind:"roll",len:len,cnt:cnt,total:+(len*cnt).toFixed(2)};
}
function cutPlan(along,across,W,loss){         // 幅をカットして面積で取る
  var len=upcm(along+loss), cw=upcm(across+loss);
  /* 5ｍを超える長さは問屋が切って出してくる。その分の継ぎが現場で発生する */
  var pieces=Math.max(1,Math.ceil(len/CUT_MAX-1e-9));
  return {kind:"cut",len:len,cw:cw,over:cw>W+1e-9,pieces:pieces,
          total:+(cw*len).toFixed(2)};
}
function matLoss(r){ return (+r.loss)||0.1; }
function matGrip(r){ return r.grip==="総糊付け" ? "総糊付け" : "グリッパー"; }
function matTile(r){ return (+r.tile)||0.5; }
function tileOf(it,r){
  if(!matSpec(it.name)||matSpec(it.name).type!=="tile") return null;
  var a=+r.h||0, b=+r.n||0; if(!(a>0&&b>0)) return null;
  return tilePlan(a,b,matTile(r));
}
function matOptions(it,r){
  var sp=matSpec(it.name); if(!sp||sp.type==="case") return null;
  var a=+r.h||0, b=+r.n||0; if(!(a>0&&b>0)) return null;
  var ls=matLoss(r);
  if(sp.type==="roll")
    return {spec:sp,mode:"roll",loss:ls,"縦":rollPlan(a,b,sp.w,ls),"横":rollPlan(b,a,sp.w,ls)};
  var c1=cutPlan(a,b,sp.w,ls), c2=cutPlan(b,a,sp.w,ls);
  /* 縦も横も反幅を越える部屋は、1枚では敷けないので継ぐ */
  if(c1.over && c2.over)
    return {spec:sp,mode:"joint",loss:ls,"縦":rollPlan(a,b,sp.w,ls),"横":rollPlan(b,a,sp.w,ls)};
  return {spec:sp,mode:"cut",loss:ls,"縦":c1,"横":c2};
}
function matPick(it,r){
  var o=matOptions(it,r); if(!o) return null;
  var d=r.dir, v1=o["縦"], v2=o["横"];
  if(!d) d = (v1.over&&!v2.over) ? "横"
           : (v2.over&&!v1.over) ? "縦"
           : (v1.total<=v2.total ? "縦" : "横");
  if(o[d].over) d=(d==="縦"?"横":"縦");
  return {dir:d,plan:o[d],opts:o,spec:o.spec,mode:o.mode,loss:o.loss};
}
function matText(it,r){
  var p=matPick(it,r); if(!p||p.plan.over) return "";
  var ls="（余裕"+Math.round(p.loss*100)+"cm）";
  if(p.plan.kind==="cut")
    return p.dir+"流し カット幅"+mfmt(p.plan.cw)+"ｍ×"+mfmt(p.plan.len)+"ｍ ＝ "
      +fmt(p.plan.total,2)+"㎡"+ls
      +(p.plan.pieces>1?"　5ｍ超のため問屋で"+p.plan.pieces+"本に分割・継ぎ"+(p.plan.pieces-1)+"本":"")
      +"　"+matGrip(r);
  return p.dir+"流し "+mfmt(p.plan.len)+"ｍ×"+p.plan.cnt+"本"
    +(p.mode==="joint"?"（継ぎ"+(p.plan.cnt-1)+"本）":"")+ls
    +(p.spec.type==="cut"?"　"+matGrip(r):"");
}

/* ===== 計算 ===== */
/* 小数を使うのは面積・長さ・帖数だけ。台数や枚数に小数点は要らない */
function decUnit(u){ return /^(㎡|ｍ|m|帖)$/.test(String(u||"")); }
function qtyOf(it){
  if(isPack(it)) return packOn(it).length;
  return (it.rows||[]).reduce(function(s,r){return s+rowVal(it,r);},0);
}
function subOf(it){ return qtyOf(it)*(+it.price||0); }
function itemsOf(j,cat){ return (j.items||[]).filter(function(i){ return i.cat===cat; }); }
function catTotal(j,cat){ return itemsOf(j,cat).reduce(function(s,i){return s+subOf(i);},0); }
function jobTotal(j){ return (j.items||[]).reduce(function(s,i){return s+subOf(i);},0); }
function clothM(j){ return (j.items||[]).reduce(function(s,i){return s+(isCloth(i.name)?qtyOf(i):0);},0); }
function openChecks(j){
  return (j.issues||[]).reduce(function(a,q){
    var sy=SYMPTOMS[q.sym]||{checks:[]}; return a+Math.max(0,sy.checks.length-((q.done||[]).length)); },0);
}
function fmt(n,d){ d=d==null?1:d; return (+n||0).toLocaleString("ja-JP",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function yen(n){ return "¥"+Math.round(+n||0).toLocaleString("ja-JP"); }

function buildPayload(j){
  var rows=[],no=0;
  CATS.forEach(function(cat){
    itemsOf(j,cat).forEach(function(it){
      /* パックは、付いてくる工事ごとに1行ずつ出す。工種もそれぞれの発注先へ。
         本体の行にだけ、いま付いているもの／入れるものを載せる */
      if(isPack(it)){
        var dd=packDef(it.name)||{};
        var gtx=(dd.groups||[]).map(function(g){
          var v=((it.now.g||{})[g.k]||[]); return v.length ? g.l+"："+v.join("・") : ""; })
          .filter(Boolean).join("／");
        var dtx=(dd.dims||[]).map(function(dm){
          var v=(it.now.d||{})[dm[0]]; return v ? dm[1]+" "+v : ""; })
          .filter(Boolean).join("／");
        var nowT=[ gtx, dtx, (it.now.opts||[]).join("・"), it.now.size,
                   it.now.maker, it.now.model,
                   (it.now.year?it.now.year+"年":""),
                   (it.now.door?"搬入 "+it.now.door:""), it.now.note ]
                 .filter(Boolean).join(" ／ ");
        var newT=[ it.nw.maker, it.nw.model, it.nw.size,
                   (it.nw.opts||[]).join("・"), it.nw.note ].filter(Boolean).join(" ");
        packOn(it).forEach(function(p,pi){
          no++;
          rows.push({NO:no, 場所:it.place||"", 工種:p.c, 工事内容:p.n,
            規格仕様: pi===0 ? (newT||"") : "",
            材料:"", 現物: pi===0 ? nowT : "",
            数量:p.q, 単位:p.u, 計測内訳: pi===0 ? ("【"+it.name+"】として一括で拾ったもの") : "",
            くくり: it.name,
            });
        });
        return;
      }
      no++;
      /* 場所が空の行は「上の行と同じ場所の続き」。
         玄関を測っている途中で行を足したとき、いちいち書き直さないため。 */
      var places=[], seenP={}, carry="";
      var placeOf=function(r){
        var pl=String(r.place||"").trim();
        if(pl) carry=pl;
        return carry;
      };
      (it.rows||[]).forEach(function(r){ var pl=placeOf(r);
        if(pl && !seenP[pl]){ seenP[pl]=1; places.push(pl); } });
      carry="";
      var uchiwake = isMeasured(it.name)
        ? (it.rows||[]).map(function(r){
              var pl=placeOf(r);
              return (pl?pl+" ":"")
                +(isCloth(it.name)?(r.part||"壁")+" ":"")
                +(+r.h||0)+"×"+(+r.n||0)
                +(r.spec?"（"+r.spec+"）":""); }).join(" ／ ")
        : ((it.rows||[]).length>1
            ? (it.rows||[]).map(function(r){ var pl=placeOf(r);
                return (pl?pl+" ":"")+(+r.qty||0)
                  +(r.spec?"（"+r.spec+"）":""); }).join(" ／ ")
            : "");
      carry="";
      /* ロール材は、現場で決めた流す向きと必要な材料も一緒に渡す */
      var zairyo = isRoll(it.name)
        ? (it.rows||[]).map(function(r){
            var tp3=tileOf(it,r);
            var tx = tp3 ? Math.round(tp3.size*100)+"cm角 "+tp3.n+"枚（予備込み"+tp3.spare+"枚）"
                         : matText(it,r);
            var pl=placeOf(r);
            return tx ? (pl?pl+" ":"")+tx : ""; })
            .filter(Boolean).join(" ／ ")
        : "";
      /* 交換するものは、現物の仕様をそのまま渡す。これが無いとISSは手配できない */
      carry="";
      var genbutsu = needsSpec2(cat,it.name)
        ? (it.rows||[]).map(function(r){
            var e=r.eq||{}, pl=placeOf(r);
            var tx=[e.maker,e.model,e.size,(e.year?e.year+"年":""),
                    (e.opts||[]).join("・"),e.note].filter(Boolean).join(" ");
            return tx ? (pl?pl+" ":"")+tx : ""; })
            .filter(Boolean).join(" ／ ")
        : "";
      /* 規格・仕様は行ごと。同じものは1回だけ並べる */
      var sps=[], spSeen={};
      (it.rows||[]).forEach(function(r){ var v=String(r.spec||"").trim();
        if(v && !spSeen[v]){ spSeen[v]=1; sps.push(v); } });
      if(!sps.length && it.spec) sps.push(it.spec);
      rows.push({NO:no,場所:places.join("・"),工種:cat,工事内容:it.name,規格仕様:sps.join(" ／ "),
        材料:zairyo,現物:genbutsu,
        数量: decUnit(it.unit) ? +(qtyOf(it).toFixed(2)) : Math.round(qtyOf(it)), 単位:it.unit,
        計測内訳: uchiwake,
        });
    });
  });
  var shots=[], done=j.photoDone||[];
  (j.rooms||[]).forEach(function(rm){
    photoGroupsFor(rm).forEach(function(g){ g.points.forEach(function(p){
      shots.push({場所:rm,区分:g.key,撮影ポイント:p,
        撮影済:(done.indexOf(rm+"::"+p)>=0)?1:0,
        写真枚数:picCount(j.id,picTagShot(rm,p))}); }); });
  });
  return {現調ID:j.gid,工事ID:j.jobNo||"",顧客名:j.customer||"",店舗:j.store||"",担当:j.staff||"",
    希望工期:j.term||"",
    納品先:delivList(j).join("・")+(j.delivMemo?"（"+j.delivMemo+"）":""),
    ブレーカー:j.breaker||"",通電:j.power||"",
    通電依頼:(j.power==="通電なし")?"要":"",
    アンペア:j.amp||"",
    職人指定:j.shokunin||"",注意事項:j.caution||"",ISS伝達メモ:j.caution||"",
    物件名:j.name||"",住所:j.addr||"",間取り:madoriText(j),工事申請:j.apply||"",
    駐車場:(j.parking||"")+(j.parkingMemo?"（"+j.parkingMemo+"）":""),鍵場所:j.key||"",エアコン台数:acTotal(j)||"",
    エアコン内訳:acList(j).map(function(x){
      return x.place+" "+x.n+"台"+(x.spec?"（"+x.spec+"）":"");}).join("・"),
    エアコン備考:((j.acFlags||[]).join("・")+" "+(j.acMemo||"")).trim(),
    自由記入:j.freeMemo||"",現調日:j.date||"",送信元:"gencho-note",
    拾い出し:rows,
    設備:(j.equip||[]).map(function(e){return {場所:e.place||"",種別:e.kind,メーカー:e.maker||"",
      品番:e.model||"",サイズ:e.size||"",設置年:e.year||"",メモ:e.note||""};}),
    不具合:(j.issues||[]).map(function(s){var sy=SYMPTOMS[s.sym]||{checks:[]};
      return {場所:s.place||"",症状:s.sym,発生箇所:s.spot||"",確認済:(s.done||[]).length,
              確認項目数:sy.checks.length,メモ:s.note||""};}),
    撮影:shots};
}
/* ===== 送信ずみの版 と いま手元の内容 の差 =====
   (A) ISSは営業の拾い出しを書き換えない。ISSが見るのは常に j.sent.snap（受け取った版）。
   (B) 営業は送信後も直せる。ただし直した内容は
       「変更をISSへ再依頼する」を押すまでISS側には一切反映されない。 */
function priceLookup(cat,name){
  var l=(KOUSHU[cat]||{}).i||[];
  for(var i=0;i<l.length;i++) if(l[i][0]===name) return l[i][2];
  return 0;
}
function snapRows(j){ return (j&&j.sent&&j.sent.snap&&j.sent.snap.拾い出し)||[]; }
function snapTotal(j){ return snapRows(j).reduce(function(s,r){
  return s+priceLookup(r.工種,r.工事内容)*(+r.数量||0); },0); }
function snapClothM(j){ return snapRows(j).reduce(function(s,r){
  return s+(isCloth(r.工事内容)?(+r.数量||0):0); },0); }
function jtime(x){ return String(x||"").slice(0,16).replace("T"," "); }

function diffList(A,B,keyf,labf,valf,kind,out){
  var am={},bm={};
  (A||[]).forEach(function(r){ am[keyf(r)]=r; });
  (B||[]).forEach(function(r){ bm[keyf(r)]=r; });
  Object.keys(bm).forEach(function(k){
    var x=am[k], y=bm[k];
    if(!x){ out.push({区分:kind,種別:"追加",対象:labf(y),後:valf(y)}); return; }
    if(valf(x)!==valf(y)) out.push({区分:kind,種別:"変更",対象:labf(y),前:valf(x),後:valf(y)});
  });
  Object.keys(am).forEach(function(k){
    if(!bm[k]) out.push({区分:kind,種別:"削除",対象:labf(am[k]),前:valf(am[k])});
  });
}
function diffSnap(a,b){
  var out=[];
  ["顧客名","店舗","担当","物件名","住所","間取り","工事申請","駐車場","鍵場所",
     "エアコン台数","エアコン内訳","エアコン備考","工事ID","希望工期","納品先","職人指定","注意事項",
     "ブレーカー","通電","通電依頼","アンペア",
     "ISS伝達メモ","自由記入","現調日"]
    .forEach(function(k){
      if(String(a[k]||"")!==String(b[k]||""))
        out.push({区分:"現場情報",種別:"変更",対象:k,前:a[k]||"（空欄）",後:b[k]||"（空欄）"});
    });
  diffList(a.拾い出し,b.拾い出し,
    function(r){ return r.工種+"｜"+r.工事内容+"｜"+(r.規格仕様||""); },
    function(r){ return r.工事内容; },
    function(r){ return fmt(r.数量,(+r.数量||0)%1?2:0)+r.単位
                        +(r.場所?"（"+r.場所+"）":"")+(r.計測内訳?"　"+r.計測内訳:"")
                        +(r.材料?"　材料 "+r.材料:"")
                        +(r.現物?"　現物 "+r.現物:""); },
    "拾い出し",out);
  diffList(a.設備,b.設備,
    function(r){ return (r.場所||"")+"｜"+(r.種別||""); },
    function(r){ return (r.種別||"")+(r.場所?"（"+r.場所+"）":""); },
    function(r){ return [r.メーカー,r.品番,r.サイズ,r.設置年,r.メモ].filter(Boolean).join(" ")||"（未記入）"; },
    "設備",out);
  diffList(a.不具合,b.不具合,
    function(r){ return (r.場所||"")+"｜"+(r.症状||""); },
    function(r){ return (r.症状||"")+(r.場所?"（"+r.場所+"）":""); },
    function(r){ return [r.発生箇所,r.メモ].filter(Boolean).join(" ")||"（メモなし）"; },
    "不具合",out);
  return out;
}
/* 送信ずみの版と、いま手元の内容との差。まだISSには届いていない分 */
function pending(j){ return (j&&j.sent) ? diffSnap(j.sent.snap, buildPayload(j)) : []; }
function commitSend(j,at){
  var prev=j.sent, snap=buildPayload(j), rev=(prev?prev.rev:0)+1;
  snap.版=rev; snap.送信日時=at;
  j.sent={at:at,rev:rev,snap:snap};
  j.revlog=(j.revlog||[]).concat([{rev:rev,at:at,changes:prev?diffSnap(prev.snap,snap):[]}]);
  j.sentAt=at;
}
function diffHTML(list,title){
  if(!list||!list.length) return "";
  var h='<div class="difbox">'+(title?'<div class="difh">'+esc(title)+'</div>':'');
  list.forEach(function(c){
    h+='<div class="difrow"><span class="dtag '+({"追加":"add","削除":"del"}[c.種別]||"chg")+'">'
      +esc(c.種別)+'</span><div class="dbody"><b>'+esc(c.区分)+'　'+esc(c.対象)+'</b>'
      +(c.前!=null?'<span class="dbefore">'+esc(c.前)+'</span>':'')
      +(c.前!=null&&c.後!=null?'<span class="darrow">→</span>':'')
      +(c.後!=null?'<span class="dafter">'+esc(c.後)+'</span>':'')
      +'</div></div>';
  });
  return h+'</div>';
}
function revlogHTML(j){
  var rl=(j.revlog||[]).filter(function(r){ return r.changes&&r.changes.length; });
  if(!rl.length) return "";
  var h='<div class="card"><div class="card-h"><h3>'+(isISS()?"営業からの変更":"これまでに送った変更")+'</h3>'
    +'<span class="eyebrow" style="margin-left:auto">'+rl.length+'回</span></div><div class="card-b">';
  rl.slice().reverse().forEach(function(r){
    h+=diffHTML(r.changes,"第"+r.rev+"版　"+jtime(r.at)+"　"+r.changes.length+"件");
  });
  return h+'</div></div>';
}

function sendToISS(mode){
  var j=J(); if(!j) return;
  if(mode==="new"){ j.gid=newGid(); j.sent=null; j.revlog=[]; }
  var pd = j.sent ? pending(j) : [];
  if(mode==="update" && j.sent && !pd.length){
    alert("いま手元の内容は、ISSに届いている版と同じです。\n直してから再依頼してください。"); return;
  }
  var p=buildPayload(j), left=photoTotals(j).left, sopen=specOpen(j);
  /* 書き取り窓に読めない行が残ったまま送ると、その内容は誰にも届かない。
     捨てる前に、必ず本人に見せる */
  var left=impLeft();
  if(left.length){
    var ls=left.slice(0,6).map(function(x){ return "・["+x.cat+"] "+x.line; }).join(NL);
    if(!confirm("読み取れないまま残っている行が "+left.length+"件あります。"+NL
      +"このままだとISSには届きません。"+NL+NL+ls
      +(left.length>6?NL+"…ほか"+(left.length-6)+"件":"")
      +NL+NL+"［OK］要確認に移して送る　／　［キャンセル］戻って直す")) return;
    var jj=J();
    jj.issues=jj.issues||[];
    left.forEach(function(x){
      jj.issues.push({place:"", sym:x.line, spot:"",
        note:"["+x.cat+"] 読み取れなかった行（声・メモから）", done:[]});
    });
    V.impBox={}; V.impText=""; save();
  }
  /* 品番が無いのはよくあること。ホームセンターの品には元から無いし、
     経年で銘板が消えていることも多い。止めずに、写真で足りると伝える */
  if(sopen) toast("品番のない交換品が "+sopen+"件。写真があればISSは進められます");
  /* 何版目かをスプレッドシートにも載せる。FileMaker側が版で新旧を判断できるように */
  p.版=(j.sent?j.sent.rev:0)+1;

    +(isMeasured(it.name)
        ? '　<span class="mode">'+(byCount?'高さ×本数':'縦×横')+'</span>'
        : '　<span class="mode">数量 '+esc(it.unit)+'</span>');

  /* 本数は壁だけ。天井・床は縦も横も寸法なので、ｍ／cmは両方に使う */

    else if(!mp){

/* 納品先は複数ありうる。文字列でも配列でも同じように扱う */
function delivList(j){
  var d=j&&j.deliv;
  if(!d) return [];
  return Array.isArray(d) ? d : String(d).split("・").filter(Boolean);
}
/* エアコンは部屋ごとに付いている。「洋室に5台」ではなく
   「洋室1に1台、LDKに1台」。洗浄も交換も部屋ごとに出るので、
   最初からそう数える */
/* 1部屋ぶんの中身。台数だけを持っていた古い形も読めるようにしておく */
function acCell(j,rm){
  var m=(j&&j.acRooms)||{}, v=m[rm];
  if(v==null) return {n:0,t:[]};
  if(typeof v==="number") return {n:v,t:[]};
  return {n:+v.n||0, t:(v.t||[]).slice()};
}
function acSet(j,rm,cell){
  j.acRooms=j.acRooms||{};
  if(cell.n<=0) delete j.acRooms[rm];
  else j.acRooms[rm]={n:cell.n, t:cell.t||[]};
  j.ac=acTotal(j);
}
function acRooms(j){ return (j&&j.acRooms) || {}; }
function acTotal(j){
  var m=acRooms(j), n=0;
  for(var k in m) n += acCell(j,k).n;
  return n;
}
/* 種別。ここが値段を決める。壁掛けと天井カセットでは倍以上ちがう */
var AC_KIND=["壁掛け","天井カセット","天井埋込","床置き","窓用","マルチ室内機"];
var AC_WASH=["自動洗浄あり","自動洗浄なし"];
function acLabel(c){
  return c.t.length ? c.t.join("・") : "";
}
/* エアコンが付いている部屋を、台数つきで並べる */
function acList(j){
  var m=acRooms(j), out=[], seen={};
  function push(rm){
    var c=acCell(j,rm);
    if(c.n>0 && !seen[rm]){ seen[rm]=1; out.push({place:rm, n:c.n, t:c.t, spec:acLabel(c)}); }
  }
  (j.rooms||[]).forEach(push);
  for(var k in m) push(k);
  return out;
}
/* エアコンが付きうる部屋。玄関や浴室には普通付かないので出さない */
function acPlaces(j){
  var out=(j.rooms||[]).filter(function(rm){
    return !/玄関|浴室|洗面|トイレ|収納|押入|バルコニー|ベランダ|階段|廊下/.test(rm);
  });
  var m=acRooms(j);
  for(var k in m) if(+m[k]>0 && out.indexOf(k)<0) out.push(k);
  return out;
}
function fld(label,key,val,type){
  return '<div class="field"><label>'+label+'</label><input type="'+(type||"text")+'" value="'+esc(val||"")+'" data-jf="'+key+'"></div>';

}

    +'<div class="pv-im"><img src="'+p.thumb+'" alt=""></div>';
  w.setAttribute("open","");

  var w=document.getElementById("picview");
