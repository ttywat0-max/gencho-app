/* ==================== 写真 ====================
   写真は文字と桁が違う。localStorage には入らないので IndexedDB に置く。
   画面に出すのは160pxの見本だけ。原寸は開いたときに初めて読む。
   端末の中だけに残り、ISSへ送るのは GAS を立ててから。 */
function picOpen(cb){
  if(PIC_DB) return cb(PIC_DB);
  if(PIC_NOSTORE) return cb(null);
  var rq;
  try{ rq=indexedDB.open("gencho-pic",1); }
  catch(e){ PIC_NOSTORE=true; return cb(null); }
  rq.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains("pic")){
      var st=db.createObjectStore("pic",{keyPath:"id"});
      st.createIndex("job","job",{unique:false});
    }
  };
  rq.onsuccess=function(e){ PIC_DB=e.target.result; cb(PIC_DB); };
  rq.onerror=function(){ PIC_NOSTORE=true; cb(null); };
}
/* 起動時に、見本と貼り先だけを覚える。原寸は持たない */
function picBoot(){
  picOpen(function(db){
    if(!db){ PIC_READY=true; return; }
    try{
      var tx=db.transaction("pic","readonly"), st=tx.objectStore("pic"), out=[];
      st.openCursor().onsuccess=function(e){
        var c=e.target.result;
        if(c){ var v=c.value; out.push({id:v.id,job:v.job,tag:v.tag,at:v.at,thumb:v.thumb}); c.continue(); }
        else { PICS=out; PIC_READY=true; render(); }
      };
    }catch(e){ PIC_READY=true; }
  });
}
/* 長辺を縮めて、見本と原寸の2枚を作る。現場の電波でも扱える大きさに */
function picShrink(file,cb){
  var url=URL.createObjectURL(file), im=new Image();
  im.onload=function(){
    function draw(max,q,type){
      var w=im.width,hh=im.height,r=Math.min(1,max/Math.max(w,hh));
      var cv=document.createElement("canvas");
      cv.width=Math.round(w*r); cv.height=Math.round(hh*r);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      return type==="url" ? cv.toDataURL("image/jpeg",q) : cv;
    }
    var thumb=draw(200,.6,"url");
    draw(1600,.72).toBlob(function(blob){
      URL.revokeObjectURL(url);
      cb(blob||file, thumb);
    },"image/jpeg",.72);
  };
  im.onerror=function(){ URL.revokeObjectURL(url); cb(null,null); };
  im.src=url;
}
function picAdd(job,tag,file,cb){
  picShrink(file,function(blob,thumb){
    if(!blob) return cb(null);
    picOpen(function(db){
      var rec={id:"p"+Date.now()+Math.random().toString(36).slice(2,7),
               job:job,tag:tag,at:new Date().toISOString(),thumb:thumb,blob:blob};
      /* 残せない置き方でも、見えないより見えたほうがいい。
         その場限りで持ち、閉じたら消えることを画面に出す */
      if(!db){
        PIC_MEM[rec.id]=rec;
        PICS.push({id:rec.id,job:rec.job,tag:rec.tag,at:rec.at,thumb:rec.thumb});
        return cb(rec.id);
      }
      try{
        var tx=db.transaction("pic","readwrite");
        tx.objectStore("pic").put(rec);
        tx.oncomplete=function(){
          PICS.push({id:rec.id,job:rec.job,tag:rec.tag,at:rec.at,thumb:rec.thumb});
          cb(rec.id);
        };
        tx.onerror=function(){ cb(null); };
      }catch(e){ cb(null); }
    });
  });
}
function picDel(id,cb){
  picOpen(function(db){
    if(!db){
      delete PIC_MEM[id];
      PICS=PICS.filter(function(p){ return p.id!==id; });
      return cb&&cb();
    }
    try{
      var tx=db.transaction("pic","readwrite");
      tx.objectStore("pic").delete(id);
      tx.oncomplete=function(){
        PICS=PICS.filter(function(p){ return p.id!==id; });
        cb&&cb();
      };
    }catch(e){ cb&&cb(); }
  });
}
/* 原寸を1枚だけ読む。開いたときにしか読まない */
function picFull(id,cb){
  if(PIC_MEM[id]) return cb(URL.createObjectURL(PIC_MEM[id].blob));
  picOpen(function(db){
    if(!db) return cb(null);
    try{
      var rq=db.transaction("pic","readonly").objectStore("pic").get(id);
      rq.onsuccess=function(){ var v=rq.result; cb(v?URL.createObjectURL(v.blob):null); };
      rq.onerror=function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function picBytesRough(job){
  /* だいたいの重さ。見本から見当をつける（原寸は見本の約25倍） */
  var k=0; (PICS||[]).forEach(function(p){ if(!job||p.job===job) k+=(p.thumb||"").length*0.75*25; });
  return k;
}
function picOf(job,tag){
  return (PICS||[]).filter(function(p){ return p.job===job && p.tag===tag; })
             .sort(function(a,b){ return a.at<b.at?-1:1; });
}
function picCount(job,tag){ return picOf(job,tag).length; }
/* 貼り先のならび。撮影ポイントは shot、工事項目は item */
function picTagShot(room,point){ return "shot::"+room+"::"+point; }
function picTagItem(cat,name){ return "item::"+cat+"::"+name; }

/* 撮る／選ぶボタンと、その下に並ぶ見本 */
function picStrip(job,tag,label){
  var list=picOf(job,tag);
  var h='<div class="picstrip">'
    +'<label class="picadd" title="写真を足す">'
    +'<input type="file" accept="image/*" capture="environment" multiple data-pic="'+esc(tag)+'">'
    +'<span>📷</span>'+(label?'<b>'+esc(label)+'</b>':'')
    +(list.length?'<span class="n">'+list.length+'</span>':'')+'</label>';
  list.forEach(function(p){
    h+='<button class="picthumb" data-picopen="'+p.id+'" title="開く">'
      +'<img src="'+p.thumb+'" alt=""></button>';
  });
  return h+'</div>';
}

/* 書き取り窓。喋った行・貼った行は、読めたそばから上の行になって消える。
   読めなかった行だけがここに残るので、直してもう一度改行すれば入る。
   name を渡すと、その工事に向けた窓になる（工事名を言わなくていい） */
function impBox(name){
  var ph = name
    ? "玄関\u000a廊下 2.4が3本\u000a洋室1 12枚\u000a\u000a場所と数だけで入ります"
    : "玄関 壁 2.4が3本\u000a廊下 壁 2.4が2本\u000a洋室1 天井 2.6かける3.5\u000aキッチン CF 3.6かける2.4\u000a\u000a改行するたびに入ります";
  var on = !!SAY_REC;
  return '<div class="impbox'+(on?" live":"")+'">'
    +'<div class="pkh"><b>'+(name?esc(name)+' を書き取り':'声・メモから書き取り')+'</b>'
    +(name
      ? 'この工事に向けた窓です。<b class="ok">工事名は言わなくて大丈夫です。</b>場所と数だけどうぞ。'
      : 'ここに喋るか、メモから貼ってください。')
    +'<b class="ok">読めた行はそのまま上に入って消えます。</b>'
    +'「あー」「えっと」は落とします。'
    +'「120かな125かな」のように迷った言葉は、捨てずに<b class="ok">要確認</b>へ立てます。'
    +'残った行は読めなかった分です。直して改行すれば入ります。</div>'
    +'<textarea data-imptext rows="5" placeholder="'+esc(ph)+'">'+esc(V.impText||"")+'</textarea>'
    +'<div class="imprest">'
    +(on?'<span class="live"><span class="mic">●</span>聞いています</span>':'')
    +(V.impGot?'<span class="ok">この画面で '+V.impGot+'行 書き取りました</span>':'')
    +(on?'<button class="btn ghost sm" data-impstop>止める</button>'
        : (V.impItem==null
            ? '<button class="btn ghost sm" data-sayall>● 声で足す</button>'
            : '<button class="btn ghost sm" data-sayit="'+V.impItem+'">● 声で足す</button>'))
    +'<button class="btn ghost sm" data-impflush>残りも入れる</button>'
    +'<button class="btn ghost sm" data-impclose>閉じる</button>'
    +'</div></div>';
}

                 :'<span class="pill ok" style="margin-left:auto">ずみ</span>')+'</div>'
    +'<div class="card-b"><div class="walkhead">';

    h+='<div class="wh'+(x.v?' on':'')+'"><span class="l">'+esc(x.l)+'</span>'
      +'<span class="v">'+(x.v?esc(x.v):'<i>'+esc(x.say)+'</i>')+'</span></div>';

/* 打っている最中に画面ごと描き直すと、iPhoneはキーボードを閉じてしまう。
   変わったところだけ塗り替えて、打っている欄には指一本ふれない */
function walkRepaint(j){
  var a=document.getElementById("wkHead"),
      b=document.getElementById("wkLog"),
      c=document.getElementById("wkTail");
  if(!a||!b||!c){ render(); return; }
  a.innerHTML=walkHeadHTML(j);
  b.innerHTML=walkLogHTML(j);
  c.innerHTML=walkTailHTML(j);
  var m=document.querySelector(".walkmic");
  if(m){
    var on=!!SAY_REC;
    m.className="walkmic"+(on?" on":"");
    m.setAttribute(on?"data-impstop":"data-walkgo","");
    if(on) m.removeAttribute("data-walkgo"); else m.removeAttribute("data-impstop");
    m.innerHTML='<span class="mic">'+(on?'■':'●')+'</span>'
      +'<b>'+(on?'聞いています　押すと止まります':'ここを押して、あとは喋るだけ')+'</b>'
      +'<span class="sub">'+(on
        ? (V.walkPlace?'いま '+esc(V.walkPlace):'部屋の名前を言うと、そこからの記録になります')
        : '工種も項目も選ばなくて大丈夫です')+'</span>';
  }
}

    +'</div><div class="card-b">';

     よく出る4つだけ出して、あとは押したら開く */

    + few.map(function(x){
        return '<button data-add="'+esc(x[0])+'">＋'+esc(x[0])
          +(x[3]?'<span class="n">'+x[3]+'</span>':'<span class="n">新</span>')+'</button>'; }).join("")

       項目まるごとで1つだと、LDKは自動洗浄あり・洋室はなし、が書けない。 */

    var active = (V.arow && V.arow[0]===idx);

    if(!active){
      h+='<button class="btn ghost wide sm" data-pick="'+idx+'" style="margin-top:7px">'
        +'この工事を打つ</button>';

    h+='<div class="hpad">'
      +'<div class="padwho"></div>'
      +'<div class="pickrow placepick"><span class="plab">場所</span><span class="pchips">'
      + (function(){
          var BUI=["壁面","天井","床"];
          var only=placesFor(j,it.name), cc=[], sn={};
          if(only){ only.forEach(function(c){ if(!sn[c]){sn[c]=1;cc.push(c);} }); }
          else {
            (j.rooms||[]).concat(PLACE_HINTS).forEach(function(c){
              if(meas && BUI.indexOf(c)>=0) return;
              if(!sn[c]){ sn[c]=1; cc.push(c); } });
            cc=cc.slice(0,24);
          }
          if(only) V.moreplace===idx && (cc=cc.concat((j.rooms||[]).concat(PLACE_HINTS)
            .filter(function(c){ return !sn[c]; }).slice(0,20)));
          return cc.map(function(c){
            return '<button data-place="'+idx+'|'+esc(c)+'">'+esc(c)+'</button>'; }).join("")
            + (only&&V.moreplace!==idx ? '<button class="add" data-moreplace="'+idx+'">＋ ほかの場所</button>' : '');
        })()
      +'</span></div>'
      + (scs
          ? '<div class="pickrow specpick"><span class="plab">仕様</span><span class="pchips">'
            + scs.map(function(c){
                return '<button data-rsc="'+idx+'|'+esc(c)+'">'+esc(c)+'</button>'; }).join("")
            +'</span>'
            +'<input class="rspec" type="text" data-rspec="'+idx+'" placeholder="この行の規格・仕様（自由に）">'
            +'</div>'
          : '');
    if(meas){
      h+=''
        +'<div class="hrow mrow"><span class="lbl unit">ｍ</span>'
        + H_M.map(function(v){ return '<button class="fav" data-hi="'+idx+'|'+v+'">'+v+'</button>'; }).join("")
        +'</div>'
        +'<div class="hrow mrow"><span class="lbl unit">cm</span>'
        + H_CM.map(function(v){ return '<button class="dec" data-hd="'+idx+'|'+v+'">'+v+'</button>'; }).join("")
        +'</div>'
        +'<div class="hrow nrow"><span class="lbl">本数</span>'
        + N_CHIPS.map(function(v){ return '<button class="dec" data-nq="'+idx+'|'+v+'">'+v+'</button>'; }).join("")
        /* 広い部屋は15本・20本も出る。数字を押してから＋10を足していく */
        +'<button class="dec plus" data-nadd="'+idx+'">＋10</button>'
        +'</div>'
        +'<div class="matbox"></div>'
        +'<p class="note padnote"></p>';
    }
    h+='</div>';
    h+='<button class="btn ghost wide sm" data-addrow="'+idx+'" style="margin-top:6px">＋ 行を足す</button>';
    }
    /* 床を張ると、既存の床との間に段差（チリ）が出る。
       見切り金物を入れるかどうかは、その場でしか判断できない。
       質問はしない。押せば足りるものを、隣に置いておくだけ */
    if(/CF|フロアタイル|長尺|タイルカーペット|カーペット|フローリング/.test(it.name)
       && (it.rows||[]).some(function(r){ return (+r.h&&+r.n)||+r.qty; })){
      var kiri=null;
      (j.items||[]).forEach(function(x){ if(x.name==="見切り金物取付") kiri=x; });
      h+='<div class="chiri">'
        +'<span class="q">段差（チリ）は出ますか。出るなら見切り金物です。</span>'
        +'<div class="chips sm">'
        + ["への字","L型","フラット","ノンスリップ"].map(function(k){
            return '<button data-kiri="'+esc(k)+'">'+esc(k)+'</button>'; }).join("")
        + ["シルバー","ブロンズ","ホワイト","木目"].map(function(k){
            return '<button data-kiri="'+esc(k)+'">'+esc(k)+'</button>'; }).join("")
        +'</div>'
        +(kiri?'<span class="ok">雑工事に '+((kiri.rows||[]).length)+'行 入っています</span>'
              :'<span class="q2">押すと雑工事に足します。声でも「への字 シルバー」で入ります。</span>')
        +'</div>';
    }
    /* 写真も、要るときだけ開く。並べておくと場所を食う */
    var ptag=picTagItem(cat,it.name), pn=picCount(j.id,ptag);
    if(V.pic===idx || pn) h+=picStrip(j.id, ptag, "この工事の写真");
    else h+='<button class="btn ghost wide sm" data-picopenbox="'+idx+'" '
      +'style="margin-top:6px">📷 この工事の写真</button>';
    if(V.impItem===idx) h+=impBox(it.name);
    h+='<div class="rtotal">合計 <b class="num">'+fmt(qtyOf(it),decUnit(it.unit)?2:0)+'</b> '+esc(it.unit)+'</div>';
    h+='</div>';

    /* 場所の候補。押すと「いま空いている行」か最後の行に入る */

    if(isISS()){
      h+='<div class="qlab"><span>単価</span><span>小計</span><span style="min-width:24px"></span></div>'
        +'<div class="qrow"><input class="num" type="number" step="1" inputmode="numeric" value="'+esc(it.price)+'" data-q="price" data-i="'+idx+'">'
        +'<span class="sub num" style="margin:0">'+yen(subOf(it))+'</span><span class="u"></span></div>';
    }

    h+='<input type="text" placeholder="'+(needsDetail(it.name)?"何をどこまで（例：既存キッチン、間仕切り壁）":"規格・仕様（この項目に共通）")
      +'" value="'+esc(it.spec)+'" data-q="spec" data-i="'+idx+'" style="margin-top:8px'
      +(needsDetail(it.name)&&!it.spec?';border-color:var(--crit)':'')+'">';
    h+='</div>';
  });

  if(isISS()&&list.length){
    h+='<div class="calc"><div class="calcrow total"><span class="k">'+esc(cat)+' 小計</span>'
      +'<span class="v num">'+yen(catTotal(j,cat))+'</span></div></div>';
  }
  h+='</div></div>';
  if(man) h+='<button class="btn ghost wide sm" data-help="'+esc(man.t)+'">'+esc(man.t)+'の調査手順を見る</button>';
  h+='<button class="btn ghost wide sm" data-fb style="margin-top:6px">この画面について、気づいたことを書く</button>';
  return app.innerHTML=h;
}

      +'<span class="s">'+esc(sum||"未記入")+'</span>'

function ef(l,k,v,i){ return '<div class="field"><label>'+l+'</label><input type="text" value="'+esc(v||"")+'" data-e="'+k+'" data-i="'+i+'"></div>'; }
/* どこも自由に打てるようにする。選択肢は近道であって、柵ではない。
   一覧に無いものは現場に必ずあるので、打ち込めないと現調ノートにならない。 */
function freeField(label, tgt, key, val, i, chips, ph){
  return '<div class="field"><label>'+esc(label)+'</label>'
    +'<input type="text" value="'+esc(val||"")+'" data-'+tgt+'="'+key+'" data-i="'+i+'"'
    +(ph?' placeholder="'+esc(ph)+'"':'')+'>'
    + ((chips&&chips.length)
        ? '<div class="chips sm" style="margin-top:5px">'
          + chips.map(function(c){
              return '<button data-setf="'+tgt+'|'+i+'|'+key+'|'+esc(c)+'" aria-pressed="'
                +(String(val||"")===c)+'">'+esc(c)+'</button>'; }).join("")
          +'</div>'
        : '')
    +'</div>';
}
/* 場所の近道。その物件の部屋を先に、よく使う言い方をあとに */
function placeChips(j){
  var out=[], seen={};
  (j.rooms||[]).concat(["屋外","PS","バルコニー","共用部","各所","全室"]).forEach(function(c){
    if(c && !seen[c]){ seen[c]=1; out.push(c); } });
  return out;
}

/* ---------- 不具合 ---------- */
function issueTab(j){
  var h='<div class="note" style="margin-bottom:10px">'
    +'工事項目にはならない「気になったこと」を残す場所です。'
    +'症状を選ぶと、現場で確かめるべき項目が出ます。</div>';
  h+='<div class="card"><div class="card-h"><h3>要確認のリスト</h3>'
    +'<span class="eyebrow" style="margin-left:auto">症状から確認項目</span></div><div class="card-b">';
  if(!(j.issues||[]).length) h+='<div class="empty">下の「＋」を押して、気になった症状を選んでください。<br>確かめるべき項目が自動で出ます。</div>';
  /* 1件ずつ畳む。いま見ている1件だけ中身を出す */
  (j.issues||[]).forEach(function(s,i){
    var sy=SYMPTOMS[s.sym]||{checks:[],ref:""}, done=s.done||[];
    var open=(V.iss===i), left0=sy.checks.length-done.length;
    h+='<div class="line'+(open?"":" fold")+'">'
      +'<button class="eqh" data-issopen="'+i+'">'
      +'<span class="k">'+esc(s.sym||"気になったこと")+'</span>'
      +'<span class="s">'+esc([s.place,s.spot].filter(Boolean).join(" ")||"")+'</span>'
      +(sy.checks.length
        ? (left0>0?'<span class="n" style="color:var(--crit);font-weight:700;font-size:12px">未'+left0+'</span>'
                  :'<span class="n" style="color:var(--ok);font-weight:700;font-size:12px">ずみ</span>')
        : '')
      +'<span class="c">'+(open?'−':'＋')+'</span></button>';
    if(!open){ h+='</div>'; return; }
    h+='<div class="top" style="align-items:center">'
      +'<button class="x" data-dels="'+i+'" aria-label="削除" style="margin-left:auto">×</button></div>'
      + freeField("症状","s","sym",s.sym,i,Object.keys(SYMPTOMS),
          "見たままを書く。下の言葉と合えば、確認項目が出ます")
      +'<div class="grid2" style="margin-top:8px">'
      + freeField("場所","s","place",s.place,i,placeChips(j),"どこか")
      +'<div class="field"><label>発生箇所</label>'
      +'<input type="text" placeholder="もっと細かく（洗面下の給水など）" value="'+esc(s.spot||"")+'" data-s="spot" data-i="'+i+'"></div>'
      +'</div>'
      +(sy.lead?'<div class="guide" style="margin-top:10px"><b>ここに注意</b>　'+esc(sy.lead)+'</div>':'')
      +'<div class="eyebrow" style="margin:11px 0 5px">確認項目　<span style="color:var(--accent)">'+esc(sy.ref)+'</span></div>';
    sy.checks.forEach(function(c,ci){
      var on=done.indexOf(ci)>=0;
      h+='<label class="shot'+(on?' on':'')+'"><input type="checkbox"'+(on?" checked":"")
        +' data-chk="'+i+'" data-ci="'+ci+'"><span>'+esc(c)+'</span></label>';
    });
    var left=sy.checks.length-done.length;
    h+='<div style="margin-top:7px">'+(left>0?'<span class="pill crit">未確認 '+left+'項目</span>':'<span class="pill ok">確認ずみ</span>')+'</div>'
      +(sy.fix?'<details class="fix"><summary>見つかったときの対応</summary><p>'+esc(sy.fix)+'</p></details>':'')
      +'<textarea data-s="note" data-i="'+i+'" placeholder="メモ" style="margin-top:9px">'+esc(s.note||"")+'</textarea></div>';
  });
  h+='<button class="btn ghost wide sm" data-adds style="margin-top:10px">＋ 不具合を追加</button></div></div>';
  return h;
}

/* ---------- 写真 ---------- */
function photoTab(j){
  var t=photoTotals(j), done=j.photoDone||[];
  var h='<div class="shout'+(t.left?'':' ok')+'"><div class="shout-h">'
    +(t.left?'📷 ここは必ず撮る　<b>残り'+t.left+'枚</b>':'📷 撮影ずみ　'+t.all+'枚')+'</div>'
    +'<div class="shout-b">📷を押すと、その場で撮れます。'
    +'<b>撮った写真はこの端末に残ります。</b>入れた時点でチェックが付くので、撮り忘れが潰れます。'
    +'<br>別のカメラで撮ったときは、チェックだけ付けてください。</div></div>';
  if(PIC_NOSTORE) h+='<div class="warnbar">この開き方では、写真をこの端末に残せません。'
    +'画面を閉じると消えます。<b>共有されたリンクから開くと残ります。</b></div>';
  if(!(j.rooms||[]).length) h+='<div class="card"><div class="empty">基本情報で間取りを選ぶと、撮る場所が出ます。</div></div>';
  (j.rooms||[]).forEach(function(rm){
    var groups=photoGroupsFor(rm);
    var all=0,got=0;
    groups.forEach(function(g){ g.points.forEach(function(p){ all++; if(done.indexOf(rm+"::"+p)>=0) got++; }); });
    /* 部屋ぜんぶを並べると、1Kでも8画面ぶんになる。
       いま撮っている部屋だけ開く。ほかは残り枚数だけ見せる */
    var ropen = (V.proom===rm);
    h+='<div class="card sec'+(ropen?" open":"")+'">'
      +'<button class="sech" data-proom="'+esc(rm)+'">'
      +'<span class="t">'+esc(rm)+'</span>'
      +(all-got?'<span class="n" style="color:var(--crit);font-weight:700">残り'+(all-got)+'枚</span>'
              :'<span class="n" style="color:var(--ok);font-weight:700">ずみ '+all+'枚</span>')
      +'<span class="c">'+(ropen?'−':'＋')+'</span></button>';
    if(!ropen){ h+='</div>'; return; }
    h+='<div class="card-b">';
    groups.forEach(function(g){
      if(g.src) h+='<div class="eyebrow" style="margin:6px 0 4px">'+esc(g.src)+'</div>';
      g.points.forEach(function(p){
        var tag=picTagShot(rm,p), nn=picCount(j.id,tag);
        var on=done.indexOf(rm+"::"+p)>=0 || nn>0;
        h+='<div class="shotrow'+(on?' on':'')+'">'
          +'<label class="shot'+(on?' on':'')+'"><input type="checkbox"'+(on?" checked":"")
          +' data-shot="'+esc(rm+"::"+p)+'"><span>'+esc(p)+'</span></label>'
          +picStrip(j.id,tag,"")
          +'</div>';
      });
    });
    h+='</div></div>';
  });
  /* 間取りを変えると撮る場所が作り直される。前に撮った写真を黙って消さない */
  var shown={};
  (j.rooms||[]).forEach(function(rm){
    photoGroupsFor(rm).forEach(function(g){ g.points.forEach(function(p){
      shown[picTagShot(rm,p)]=1; }); });
  });
  var lost=(PICS||[]).filter(function(p){
    return p.job===j.id && p.tag.indexOf("shot::")===0 && !shown[p.tag]; });
  if(lost.length){
    h+='<div class="card"><div class="card-h"><h3>行き場のない写真</h3>'
      +'<span class="pill" style="margin-left:auto">'+lost.length+'枚</span></div><div class="card-b">'
      +'<div class="note">間取りを変えたときに、撮る場所が入れ替わった写真です。消していません。</div>'
      +'<div class="picstrip">'
      + lost.map(function(p){
          return '<button class="picthumb" data-picopen="'+p.id+'" title="'
            +esc(p.tag.split("::").slice(1).join(" "))+'"><img src="'+p.thumb+'" alt=""></button>';
        }).join("")
      +'</div></div></div>';
  }
  return h;
}

/* ---------- 操作 ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-open],[data-new],[data-reset],[data-back],[data-tab],[data-cat],[data-go],"
    +"[data-add],[data-addfree],[data-del],[data-addm],[data-delm],[data-jset],[data-jflag],[data-jmulti],[data-acn],[data-acadd],[data-ack],[data-kiri],[data-guide],[data-picopenbox],[data-more],[data-pick],[data-sec],[data-proom],[data-eqopen],[data-issopen],[data-helpc],[data-helpdone],[data-fb],[data-fbclose],[data-fbcopy],[data-voice],[data-acflag],[data-setf],[data-spec],"
    +"[data-addroom],[data-delroom],[data-openrooms],[data-adde],[data-dele],[data-adds],[data-dels],[data-help],[data-send],"
    +"[data-keyset],[data-keydel],[data-keyadd],[data-place],[data-allplace],[data-pdrop],[data-moreplace],[data-rsc],[data-rpart],[data-hi],[data-hd],[data-nq],[data-nadd],[data-dir],[data-loss],[data-grip],[data-tile],[data-eqo],[data-pk],[data-pko],[data-pks],[data-pkg],[data-pkdz],[data-pkp],[data-addpack],[data-say],[data-imp],[data-impflush],[data-impclose],[data-addrow],[data-delrow],[data-sayit],[data-impstop],[data-saybox],[data-sayword],[data-picopen],[data-picclose],[data-picdel],[data-walkgo],[data-go],[data-walktypeon],[data-walktypeoff],[data-walkflush],[data-sayall]");
  if(!t) return;
  var j=J();

  /* (A) ISS委託者に通すのは移動と参照だけ。書き換えは全部ここで止める */
  if(isISS() && !(t.dataset.open||t.dataset.back||t.dataset.tab||t.dataset.cat
                  ||t.dataset.go||t.dataset.help!=null)){
    alert("ISS委託者モードでは、営業が入力した内容は変更できません。\n直しが必要な場合は、営業へ差し戻してください。");
    return;
  }
  if(t.dataset.help!=null){ openHelp(t.dataset.help); return; }
  if(t.dataset.send){ sendToISS(t.dataset.send); return; }
  /* ISSは入力画面を持たない。受け取った1枚の見積フォーマットへ直行する */
  if(t.dataset.open){ V.tab="info"; return go(isISS()?"sum":"job",t.dataset.open); }
  if(t.hasAttribute("data-new")){
    var id=uid();
    DB.jobs.unshift({id:id,gid:newGid(),customer:"",store:"",staff:"",name:"新規物件",addr:"",
      madori:"",mflags:[],madoriMemo:"",apply:"",parking:"",key:"",issMemo:"",myMemo:"",
      date:new Date().toISOString().slice(0,10),rooms:[],items:[],equip:[],issues:[],photoDone:[]});
    save(); V.tab="info"; return go("job",id);
  }
  if(t.hasAttribute("data-reset")){
    if(!confirm("入力した内容をすべて消して、サンプルの状態に戻します。よろしいですか？")) return;
    DB={jobs:[seed()]}; save(); return go("home");
  }
  if(t.dataset.back){
    if(t.dataset.back==="home") return go("home");
    /* 工種から戻るとき、いま書いたものを一瞬だけ見せる。
       どこに保存されたのか分からない、という不安への答え */
    if(V.view==="koushu" && j && V.cat){
      var wt=wroteText(j,V.cat);
      toast(wt ? V.cat+"に書き留めました　"+wt : V.cat+"は、まだ何も書いていません");
    }
    V.tab=t.dataset.back; return go("job");
  }
  /* タブを切り替えたら先頭から見せる。前の画面のスクロール位置が残っていた */
  if(t.dataset.tab){ V.tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(t.dataset.cat){ return go("koushu",V.job,t.dataset.cat); }
  if(t.dataset.go){ return go(t.dataset.go); }

  if(t.hasAttribute("data-imp")){
    V.imp = (V.imp===V.cat && V.impItem==null) ? null : V.cat;
    V.impItem=null; return render();
  }
  /* 項目の右肩のマイク。その項目に向けて喋る */
  if(t.dataset.sayit!=null&&t.dataset.sayit!==""&&j){
    var si=+t.dataset.sayit;
    if(V.impItem===si && SAY_REC){ stopDictate(); return render(); }
    /* 別の項目に移るときだけ中身を入れ替える。
       同じ項目でもう一度押しただけで、書いたものを消さない */
    if(V.impItem!==si){ V.impText=""; V.impGot=0; }
    V.imp=V.cat; V.impItem=si;
    render(); startDictate(); return;
  }
  if(t.hasAttribute("data-impstop")){ stopDictate(); return render(); }
  /* 工種ぜんぶに向けて喋る。工事名から言う */
  if(t.hasAttribute("data-sayall")&&j){
    /* 工種ぜんぶに向けて喋る。すでに書いてあるものは消さない */
    if(V.impItem!=null){ V.impText=""; V.impGot=0; }
    V.imp=V.cat; V.impItem=null;
    render(); startDictate(); return;
  }
  if(t.hasAttribute("data-walktypeon")){ V.walkType=true; render();
    var e1=document.querySelector("[data-walktext]"); if(e1) e1.focus(); return; }
  if(t.hasAttribute("data-walktypeoff")){ V.walkType=false; V.walkText=""; return render(); }
  if(t.hasAttribute("data-walkflush")&&j){
    var rest=String(V.walkText||"").trim();
    if(!rest){ toast("打った文がありません"); return; }
    rest.split(SPLIT_LINES).forEach(function(L){ if(L.trim()) walkLine(j,L); });
    V.walkText="";
    var te=document.querySelector("[data-walktext]"); if(te) te.value="";
    save(); walkRepaint(j); return;
  }
  /* 歩きはじめる。押すのはこの1回だけ */
  if(t.hasAttribute("data-walkgo")&&j){
    V.walkPlace=V.walkPlace||null; startDictate(); return render();
  }

  if(t.dataset.picopen){ picView(t.dataset.picopen); return; }
  if(t.hasAttribute("data-picclose")){ picClose(); return; }
  if(t.dataset.picdel){
    var pid=t.dataset.picdel;
    picDel(pid,function(){ picClose(); render(); toast("写真を1枚消しました"); });
    return;
  }
  if(t.hasAttribute("data-impclose")){
    stopDictate(); V.imp=null; V.impItem=null; V.impText=""; V.impGot=0; return render();
  }
  if(t.hasAttribute("data-sayword")&&j){
    var w=t.getAttribute("data-sayword");
    V.sayText=""; sayJump(j, sayMatch(w), w); return render();
  }
  /* 改行していない最後の行も入れる */
  if(t.hasAttribute("data-impflush")&&j){
    if(!flushImp(j)) toast(V.impText ? "読み取れる行がありません" : "書き取る文がありません");
    return;
  }
  if(t.hasAttribute("data-say")){
    startSay();
    return;
  }
  if(t.dataset.addpack&&j){
    var np=newPack(t.dataset.addpack); if(!np) return;
    j.items.push(np); delete j.sample; save();
    V.focus="it"+(j.items.length-1); return render();
  }
  if(t.dataset.add&&j){
    var p=pick(V.cat,t.dataset.add);
    var exist=null;
    (j.items||[]).forEach(function(x){ if(x.cat===V.cat && x.name===p[0]) exist=x; });
    if(exist){ exist.rows.push(newRow(exist,exist.rows[exist.rows.length-1])); }
    else {
      var ni=newItem(V.cat,p[0],p[1],p[2]);
      /* 基本情報で分かっていることは、そのまま持ってくる。同じことを2回打たせない */
      if(/エアコン/.test(p[0]) && acTotal(j)>0){
        /* 基本情報で「どの部屋に何台・どんな種別か」まで数えてある。
           種別で洗浄の値段が倍以上ちがうので、行ごとにそのまま持たせる */
        ni.rows=acList(j).map(function(x){
          return {place:x.place, qty:x.n, spec:x.spec||""};
        });
      }
      /* ルームクリーニングは間取りで単価が決まる。基本情報で選んだ間取りを入れておく */
      if(/クリーニング/.test(p[0]) && madoriText(j)){
        ni.rows[0].spec=madoriText(j);
        if(!ni.rows[0].qty) ni.rows[0].qty=1;
      }
      j.items.push(ni);
    }
    delete j.sample; save();
    var ai=(j.items||[]).indexOf(exist||j.items[j.items.length-1]);
    V.focus="it"+ai;
    /* 足した直後は、そのまま打てる状態にする。もう一度押させない */
    var ait=j.items[ai];
    if(ait && !isPack(ait)){
      if(!(ait.rows||[]).length) ait.rows=[newRow(ait,null)];
      V.arow=[ai, ait.rows.length-1]; V.afield="h"; save();
    }
    return render();
  }
  if(t.hasAttribute("data-addfree")&&j){
    var nm=prompt("工事内容を入力してください"); if(!nm) return;
    j.items.push(newItem(V.cat,nm,"式",0));
    delete j.sample; save(); V.focus="it"+(j.items.length-1); return render();
  }
  if(t.dataset.del!=null&&j&&V.view==="koushu"){ j.items.splice(+t.dataset.del,1); save(); return render(); }
  if(t.hasAttribute("data-del")&&j&&V.view==="job"){
    if(!confirm("この現調を削除します。よろしいですか？")) return;
    DB.jobs=DB.jobs.filter(function(x){return x.id!==V.job;}); save(); return go("home");
  }
  if((t.dataset.hi||t.dataset.hd)&&j){
    var isM=!!t.dataset.hi;
    var hp=(t.dataset.hi||t.dataset.hd).split("|"), hit=j.items[+hp[0]];
    var ri2=(V.arow&&V.arow[0]===+hp[0]) ? V.arow[1] : hit.rows.length-1;
    if(!hit.rows[ri2]) ri2=hit.rows.length-1;
    /* 壁の本数は掛ける相手なのでパッドでは触らない。
       天井・床は縦も横も寸法なので、いま触っている欄に入れる */
    var fld=(rowMode(hit,hit.rows[ri2])==="本数") ? "h" : (V.afield==="n"?"n":"h");
    var cur=String(hit.rows[ri2][fld]==null?"":hit.rows[ri2][fld]);
    var m3=cur.match(/^(\d*)(?:\.(\d))?/) || ["","",""];
    var mp = isM ? hp[1] : (m3[1]||"0");
    var cp = isM ? ((m3[2]||"0")+"0") : hp[1];
    hit.rows[ri2][fld]=(+mp + (+cp)/100).toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
    var el2=document.querySelector('[data-r="'+fld+'"][data-i="'+hp[0]+'"][data-ri="'+ri2+'"]');
    if(el2) el2.value=hit.rows[ri2][fld];
    delete j.sample; save(); soft(); paintActive(+hp[0]);
    /* ｍを押した直後はcmを選ぶので留まる。cmまで決まったら次の欄へ移す */
    if(!isM && fld==="h"){
      var nx=document.querySelector('[data-r="n"][data-i="'+hp[0]+'"][data-ri="'+ri2+'"]');
      if(nx){ nx.focus(); nx.select&&nx.select(); }
    }
    return;
  }
  if(t.dataset.addrow!=null&&j){
    V.afield="h";
    var ai=+t.dataset.addrow, arit=j.items[ai];
    // 場所・壁天井・高さは前の行から引き継ぎ、本数だけ空。変わるのは本数だけだから
    arit.rows.push(newRow(arit, arit.rows[arit.rows.length-1]));
    V.arow=[ai, arit.rows.length-1];          // 足した行がそのままパッドの書き込み先になる
    delete j.sample; save(); V.focus="it"+ai; return render();
  }
  if(t.dataset.delrow&&j){
    var dp=t.dataset.delrow.split("|"), drit=j.items[+dp[0]];
    if(drit.rows.length>1) drit.rows.splice(+dp[1],1); save(); return render();
  }
  if(t.dataset.addm!=null&&j){
    var ait=j.items[+t.dataset.addm];
    ait.meas.push(measMode(ait)==="本数" ? {h:2.4,n:1} : {h:3.6,n:2.5});
    save(); return render();
  }
  if(t.dataset.delm!=null&&j){ var it2=j.items[+t.dataset.delm];
    if(it2.meas.length>1) it2.meas.splice(+t.dataset.mi,1); save(); return render(); }

  if(t.dataset.jset&&j){
    var jp=t.dataset.jset.split("|");
    j[jp[0]]=(j[jp[0]]===jp[1]?"":jp[1]);
    if(jp[0]==="madori"&&j[jp[0]]) setRooms(j);
    delete j.sample; save(); return render();
  }
  if(t.dataset.keyset&&j){ j.key=t.dataset.keyset; delete j.sample; save(); return render(); }
  if(t.dataset.keydel){
    DB.keyPlaces=(DB.keyPlaces||[]).filter(function(k){return k!==t.dataset.keydel;});
    save(); return render();
  }
  if(t.hasAttribute("data-keyadd")&&j&&j.key){
    DB.keyPlaces=DB.keyPlaces||[];
    if(DB.keyPlaces.indexOf(j.key)<0) DB.keyPlaces.unshift(j.key);
    DB.keyPlaces=DB.keyPlaces.slice(0,12);   // 増えすぎないように12件まで
    save(); return render();
  }
  /* 近道のチップ。押すと欄に入り、もう一度押すと消える */
  if(t.dataset.setf&&j){
    var ff=t.dataset.setf.split("|");
    var arr = (ff[0]==="e") ? j.equip : j.issues;
    var obj = arr[+ff[1]], fk=ff[2], fv=ff.slice(3).join("|");
    obj[fk] = (String(obj[fk]||"")===fv) ? "" : fv;
    delete j.sample; save(); return render();
  }
  if(t.dataset.acflag&&j){
    j.acFlags=j.acFlags||[];
    var ai2=j.acFlags.indexOf(t.dataset.acflag);
    if(ai2>=0) j.acFlags.splice(ai2,1); else j.acFlags.push(t.dataset.acflag);
    delete j.sample; save(); return render();
  }
  /* いくつでも選べる欄。押すたびに入り、もう一度押すと外れる */
  /* 部屋ごとのエアコン台数。＋−で数える */
  /* 見切り金物。床の工事の隣から、その場で足す */
  if(t.dataset.kiri&&j){
    addKiri(j, t.dataset.kiri, V.walkPlace);
    save(); return render();
  }
  if(t.dataset.acn&&j){
    var ap=t.dataset.acn.split("|"), rm=ap[0], d=+ap[1];
    j.acRooms=j.acRooms||{};
    var c3=acCell(j,rm);
    c3.n=Math.min(Math.max(c3.n+d,0),9);
    acSet(j,rm,c3);
    delete j.sample; save(); return render();
  }
  /* 部屋ごとの種別。押すたびに入り、もう一度押すと外れる */
  if(t.hasAttribute("data-voice")){
    VOICE=!VOICE;
    try{ localStorage.setItem("genchoVoice", VOICE?"1":"0"); }catch(e){}
    if(!VOICE) stopDictate();
    toast(VOICE?"声で書くを出しました（開発中）":"声で書くをしまいました");
    return render();
  }
  if(t.hasAttribute("data-fb")){ fbOpen(); return; }
  if(t.hasAttribute("data-fbclose")){ fbClose(); return; }
  if(t.hasAttribute("data-fbcopy")){
    var txt=fbText(), s2=document.getElementById("fbs");
    function done(ok){
      if(s2) s2.innerHTML = ok
        ? '<b class="ok">コピーしました。チャットワークに貼ってください。</b>'
        : '<b>コピーできませんでした。下の文を長押しして選んでください。</b>'
          +'<textarea rows="7" readonly style="margin-top:7px">'+esc(txt)+'</textarea>';
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ done(true); },function(){ done(false); });
    } else done(false);
    return;
  }
  if(t.dataset.issopen!=null){
    V.iss = (V.iss===+t.dataset.issopen) ? null : +t.dataset.issopen;
    return render();
  }
  if(t.dataset.eqopen!=null){
    V.eq = (V.eq===+t.dataset.eqopen) ? null : +t.dataset.eqopen;
    return render();
  }
  if(t.dataset.proom){
    V.proom = (V.proom===t.dataset.proom) ? null : t.dataset.proom;
    return render();
  }
  if(t.hasAttribute("data-helpc")){
    V.help = (V.help!=null) ? !V.help : helpSeen();
    return render();
  }
  if(t.hasAttribute("data-helpdone")){
    try{ localStorage.setItem("genchoHelp","1"); }catch(e){}
    V.help=false; return render();
  }
  if(t.dataset.sec){
    V.sec=V.sec||{};
    V.sec[t.dataset.sec] = !V.sec[t.dataset.sec];
    return render();
  }
  if(t.dataset.guide!=null){
    V.guide = (V.guide===+t.dataset.guide) ? null : +t.dataset.guide; return render();
  }
  if(t.dataset.picopenbox!=null){ V.pic=+t.dataset.picopenbox; return render(); }
  if(t.dataset.more!=null){ V.more = t.dataset.more || null; return render(); }
  /* この工事を打つ——場所チップも数字パッドも、ここで初めて出す */
  if(t.dataset.pick!=null&&j){
    var pi=+t.dataset.pick, pit=j.items[pi];
    if(pit){
      if(!(pit.rows||[]).length){ pit.rows=[newRow(pit,null)]; save(); }
      V.arow=[pi, pit.rows.length-1]; V.afield="h";
    }
    return render();
  }
  if(t.dataset.ack&&j){
    var kp2=t.dataset.ack.split("|"), rm2=kp2[0], kind=kp2[1];
    var c2=acCell(j,rm2);
    var ki2=c2.t.indexOf(kind);
    if(ki2>=0) c2.t.splice(ki2,1);
    else {
      /* 形は1つだけ、洗浄の有無も1つだけ。同じ組の別の答えは外す */
      var grp = (AC_KIND.indexOf(kind)>=0) ? AC_KIND : AC_WASH;
      c2.t = c2.t.filter(function(x){ return grp.indexOf(x)<0; });
      c2.t.push(kind);
    }
    acSet(j,rm2,c2); delete j.sample; save(); return render();
  }
  if(t.dataset.acadd&&j){
    j.acRooms=j.acRooms||{};
    if(!j.acRooms[t.dataset.acadd]) acSet(j,t.dataset.acadd,{n:1,t:[]});
    delete j.sample; save(); return render();
  }
  if(t.dataset.jmulti&&j){
    var mp=t.dataset.jmulti.split("|"), key=mp[0], val=mp[1];
    var cur=(key==="deliv") ? delivList(j) : (Array.isArray(j[key])?j[key].slice():[]);
    var ci=cur.indexOf(val);
    if(ci>=0) cur.splice(ci,1); else cur.push(val);
    j[key]=cur; delete j.sample; save(); return render();
  }
  if(t.dataset.jflag&&j){
    j.mflags=j.mflags||[];
    var fi=j.mflags.indexOf(t.dataset.jflag);
    if(fi>=0) j.mflags.splice(fi,1); else j.mflags.push(t.dataset.jflag);
    /* メゾネットを付け外ししたら階段の有無が変わるので、部屋を作り直す */
    if(t.dataset.jflag==="メゾネット" && j.madori) setRooms(j);
    delete j.sample; save(); return render();
  }
  if(t.dataset.rpart&&j){
    var rp=t.dataset.rpart.split("|"), rit=j.items[+rp[0]], rr=rit.rows[+rp[1]];
    if(rr.part!==rp[2]){
      /* 壁は「高さ×本数」、天井は「縦×横」。意味が変わるので数字は残さない */
      rr.part=rp[2]; rr.h=""; rr.n="";
      /* 壁は「高さ×本数」、天井は「縦×横」。薄い字も入れ替える */
      var lab = (rowMode(rit,rr)==="本数") ? ["高さ","本数"] : ["縦","横"];
      ["h","n"].forEach(function(k,ki){
        var q=document.querySelector('[data-r="'+k+'"][data-i="'+rp[0]+'"][data-ri="'+rp[1]+'"]');
        if(q){ q.value=""; q.placeholder=lab[ki]; }
      });
    }
    t.parentNode.querySelectorAll("button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.rpart===t.dataset.rpart)); });
    V.arow=[+rp[0],+rp[1]];
    delete j.sample; save(); paintActive(+rp[0]); soft();
    return;
  }
  if(t.dataset.dir&&j){
    var dp=t.dataset.dir.split("|"), dit=j.items[+dp[0]], drow=dit.rows[+dp[1]];
    var dop=matOptions(dit,drow);
    if(dop && dop[dp[2]] && dop[dp[2]].over) return;   // 反幅を越える向きは選べない
    drow.dir=dp[2];
    V.arow=[+dp[0],+dp[1]];
    delete j.sample; save(); paintActive(+dp[0]);
    return;
  }
  if(t.dataset.loss&&j){
    var lp=t.dataset.loss.split("|");
    j.items[+lp[0]].rows[+lp[1]].loss=+lp[2];
    V.arow=[+lp[0],+lp[1]];
    delete j.sample; save(); paintActive(+lp[0]);
    return;
  }
  if(t.dataset.grip&&j){
    var gp=t.dataset.grip.split("|");
    j.items[+gp[0]].rows[+gp[1]].grip=gp[2];
    V.arow=[+gp[0],+gp[1]];
    delete j.sample; save(); paintActive(+gp[0]);
    return;
  }
  if(t.dataset.tile&&j){
    var tp2=t.dataset.tile.split("|");
    j.items[+tp2[0]].rows[+tp2[1]].tile=+tp2[2];
    V.arow=[+tp2[0],+tp2[1]];
    delete j.sample; save(); paintActive(+tp2[0]);
    return;
  }
  /* パックの付帯工事を外す・戻す */
  if(t.dataset.pk&&j){
    var kp=t.dataset.pk.split("|"), kit=j.items[+kp[0]], kpt=kit.parts[+kp[1]];
    kpt.on=!kpt.on;
    delete j.sample; save(); V.focus="it"+kp[0]; return render();
  }
  if(t.dataset.pko&&j){
    var op=t.dataset.pko.split("|"), oit=j.items[+op[0]], og=oit[op[1]];
    og.opts=og.opts||[];
    var ow=op.slice(2).join("|"), oi=og.opts.indexOf(ow);
    if(oi>=0) og.opts.splice(oi,1); else og.opts.push(ow);
    t.setAttribute("aria-pressed", String(oi<0));
    delete j.sample; save(); return;
  }
  /* 問診票の答え。複数選べる */
  if(t.dataset.pkg&&j){
    var gp=t.dataset.pkg.split("|"), git=j.items[+gp[0]], grp=git[gp[1]];
    var gk=gp[2], gvv=gp.slice(3).join("|");
    var gg=(grp.g=grp.g||{}); gg[gk]=gg[gk]||[];
    var gi=gg[gk].indexOf(gvv);
    if(gi>=0) gg[gk].splice(gi,1); else gg[gk].push(gvv);
    delete j.sample; save(); V.focus="it"+gp[0]; return render();
  }
  if(t.dataset.pkdz&&j){
    var zp=t.dataset.pkdz.split("|"), zit=j.items[+zp[0]], zrp=zit[zp[1]];
    var zk=zp[2], zv=zp.slice(3).join("|");
    var zd=(zrp.d=zrp.d||{});
    zd[zk] = (zd[zk]===zv) ? "" : zv;
    delete j.sample; save(); V.focus="it"+zp[0]; return render();
  }
  if(t.dataset.pks&&j){
    var sp2=t.dataset.pks.split("|"), sit=j.items[+sp2[0]], sg=sit[sp2[1]];
    var sv=sp2.slice(2).join("|");
    sg.size = (sg.size===sv) ? "" : sv;
    delete j.sample; save(); V.focus="it"+sp2[0]; return render();
  }
  if(t.dataset.pkp&&j){
    var pk2=t.dataset.pkp.split("|"), pit2=j.items[+pk2[0]];
    pit2.place=pk2.slice(1).join("|");
    delete j.sample; save(); V.focus="it"+pk2[0]; return render();
  }
  if(t.dataset.eqo&&j){
    var ep=t.dataset.eqo.split("|"), eri=j.items[+ep[0]].rows[+ep[1]];
    var eq=(eri.eq=eri.eq||{}); eq.opts=eq.opts||[];
    var w=ep.slice(2).join("|"), wi=eq.opts.indexOf(w);
    if(wi>=0) eq.opts.splice(wi,1); else eq.opts.push(w);
    t.setAttribute("aria-pressed", String(wi<0));
    delete j.sample; save();
    return;
  }
  if((t.dataset.nq||t.dataset.nadd!=null)&&j){
    var isAdd=(t.dataset.nadd!=null);
    var np=(isAdd?t.dataset.nadd:t.dataset.nq).split("|"), nit=j.items[+np[0]];
    var nri=(V.arow&&V.arow[0]===+np[0])?V.arow[1]:nit.rows.length-1;
    if(!nit.rows[nri]) nri=nit.rows.length-1;
    /* 数字は置き換え、＋10は足していく。15本・20本もこれで届く */
    nit.rows[nri].n = isAdd ? String((+nit.rows[nri].n||0)+10) : np[1];
    var nel=document.querySelector('[data-r="n"][data-i="'+np[0]+'"][data-ri="'+nri+'"]');
    if(nel) nel.value=nit.rows[nri].n;
    delete j.sample; save(); soft();
    return;
  }
  /* ▾ を押したら、その行を選んで選択肢のところへ寄せる */
  if(t.dataset.pdrop&&j){
    var dp2=t.dataset.pdrop.split("|");
    V.arow=[+dp2[0],+dp2[1]]; V.afield="h"; paintActive(+dp2[0]);
    var pk=document.getElementById("it"+dp2[0]);
    pk=pk&&pk.querySelector(".placepick");
    if(pk){ try{ pk.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} }
    return;
  }
  if(t.dataset.moreplace!=null){
    V.moreplace = (V.moreplace===+t.dataset.moreplace) ? null : +t.dataset.moreplace;
    V.focus="it"+t.dataset.moreplace; return render();
  }
  /* 規格・仕様は行ごと。押すと、いま触っている行に足したり外したりする */
  if(t.dataset.rsc&&j){
    var sc=t.dataset.rsc.split("|"), si=+sc[0], sit=j.items[si], sw=sc.slice(1).join("|");
    var sri=(V.arow&&V.arow[0]===si)?V.arow[1]:sit.rows.length-1;
    if(!sit.rows[sri]) sri=sit.rows.length-1;
    var srow=sit.rows[sri], cur=String(srow.spec||"");
    srow.spec = (cur.indexOf(sw)>=0)
      ? cur.replace(sw,"").replace(/\s{2,}/g," ").trim()
      : (cur?cur+" ":"")+sw;
    delete j.sample; save(); paintActive(si);
    return;
  }
  if(t.dataset.allplace!=null){
    V.allplace = (V.allplace===+t.dataset.allplace) ? null : +t.dataset.allplace;
    V.focus="it"+t.dataset.allplace; return render();
  }
  if(t.dataset.place&&j){
    var pp=t.dataset.place.split("|"), pi=+pp[0], pit=j.items[pi];
    /* いま入力している行に入れる。
       前は「いちばん上の空欄」に入れていたが、空欄は
       「上の行と同じ場所」という意味で意図的に空けてあることがあり、
       そこへ別の場所が飛び込んでいた。 */
    var pri=(V.arow&&V.arow[0]===pi) ? V.arow[1] : pit.rows.length-1;
    if(!pit.rows[pri]) pri=pit.rows.length-1;
    var tgtRow=pit.rows[pri];
    tgtRow.place = (tgtRow.place===pp[1] ? "" : pp[1]);
    V.arow=[pi,pri];
    delete j.sample; save();
    /* 描き直さずに欄だけ入れ替える。押した位置から動かないように */
    var pel=document.querySelector('[data-r="place"][data-i="'+pi+'"][data-ri="'+pri+'"]');
    if(pel) pel.value=tgtRow.place;
    var pw=t.parentNode;
    if(pw) pw.querySelectorAll("[data-place]").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.place===t.dataset.place && !!tgtRow.place)); });
    paintActive(pi); soft();
    return;
  }
  if(t.dataset.spec&&j){
    var sp=t.dataset.spec.split("|"), itm=j.items[+sp[0]], w=sp[1], cur=String(itm.spec||"");
    itm.spec = cur.indexOf(w)>=0
      ? cur.replace(w,"").replace(/\s{2,}/g," ").trim()
      : (cur?cur+" ":"")+w;
    save(); return render();
  }
  if(t.hasAttribute("data-openrooms")){ V.rooms=!V.rooms; return render(); }
  if(t.dataset.addroom&&j){
    j.rooms=j.rooms||[];
    // 複数あるのが普通の部屋は、最初から番号を振る（洋室1、洋室2…）
    var NUMBERED=["洋室","和室","居室","収納","バルコニー"];
    var base=t.dataset.addroom, nm2=base, k=1;
    if(NUMBERED.indexOf(base)>=0){ nm2=base+"1"; }
    while(j.rooms.indexOf(nm2)>=0){ k++; nm2=base+k; }
    j.rooms.push(nm2); delete j.roomsAuto; delete j.sample; save(); return render();
  }
  if(t.dataset.delroom!=null&&j){ j.rooms.splice(+t.dataset.delroom,1); delete j.roomsAuto; save(); return render(); }
  if(t.hasAttribute("data-adde")&&j){
    V.eq=(j.equip||[]).length;
    /* 勝手に決めない。何の設備かも、どこかも、現場が書く */
    j.equip.push({place:"",kind:"",maker:"",model:"",size:"",year:"",note:""});
    save(); return render(); }
  if(t.dataset.dele!=null&&j){ j.equip.splice(+t.dataset.dele,1); save(); return render(); }
  if(t.hasAttribute("data-adds")&&j){
    V.iss=(j.issues||[]).length;
    j.issues.push({place:"",sym:"",spot:"",note:"",done:[]}); save(); return render(); }
  if(t.dataset.dels!=null&&j){ j.issues.splice(+t.dataset.dels,1); save(); return render(); }
});

/* 間取りに合わせて部屋を作り直し、無くなった部屋の撮影チェックも落とす */
function setRooms(j){
  j.rooms=roomsForJob(j);
  j.roomsAuto=1;
  var ok={}; j.rooms.forEach(function(r){ ok[r]=1; });
  j.photoDone=(j.photoDone||[]).filter(function(p){ return ok[String(p).split("::")[0]]; });
}
/* 間取りを変えたら、部屋は必ず作り直す。
   ここで確認を挟んでいたせいで、5LDK→1R と選び直しても部屋も写真の枚数も
   古いままになる事故が起きていた。守っている価値（部屋名の手直し）より、
   数が合わないことの害のほうが大きい。名前はあとから直せる。 */
function confirmRooms(j){
  return true;
  return confirm("間取りに合わせて部屋を作り直しますか？\n（いまの部屋リストは置き換わります）");
}

/* 写真を撮った／選んだ。複数枚まとめて入る */
document.addEventListener("change",function(e){
  var el=e.target; if(!el.dataset||el.dataset.pic===undefined) return;
  var j=J(); if(!j||isISS()) return;
  var tag=el.dataset.pic, files=[].slice.call(el.files||[]);
  if(!files.length) return;
  el.value="";
  var left=files.length, added=0;
  toast(files.length+"枚 取り込んでいます…");
  files.forEach(function(f){
    picAdd(j.id,tag,f,function(id){
      if(id) added++;
      if(--left===0){
        /* 撮影ポイントに入れたら、撮影ずみにする。二度手間をなくす */
        if(tag.indexOf("shot::")===0){
          var k=tag.slice(6).replace("::","::");
          j.photoDone=j.photoDone||[];
          if(j.photoDone.indexOf(k)<0){ j.photoDone.push(k); }
        }
        delete j.sample; save(); render();
        toast(added?added+"枚 入れました":"写真を読めませんでした");
      }
    });
  });
});

document.addEventListener("input",function(e){
  var el=e.target, j=J(); if(!j||isISS()) return;
  if(el.dataset.jf){ j[el.dataset.jf]=el.value; delete j.sample; save(); return; }
  /* 名前を手で直したら、以降は黙って作り直さない */
  if(el.dataset.room!=null){ j.rooms[+el.dataset.room]=el.value; delete j.roomsAuto; save(); return; }
  if(el.dataset.m){ j.items[+el.dataset.i].meas[+el.dataset.mi][el.dataset.m]=el.value; save(); soft(); return; }
  if(el.dataset.r){
    var rit=j.items[+el.dataset.i], rr=rit.rows[+el.dataset.ri];
    if(el.dataset.r==="qty" && !decUnit(rit.unit) && el.value!==""){
      var rv=Math.max(0,Math.round(+el.value||0));
      rr.qty=rv; if(String(rv)!==el.value) el.value=rv;
    } else { rr[el.dataset.r]=el.value; }
    save(); soft(); return;
  }
  if(el.dataset.q){
    j.items[+el.dataset.i][el.dataset.q]=el.value; save(); soft(); return;
  }
  if(el.dataset.walktext!==undefined){
    /* 改行までを確定とみなす。入った行は消え、読めなかった行だけ残る */
    var raw=el.value, ix=raw.lastIndexOf(String.fromCharCode(10));
    if(ix<0){ V.walkText=raw; return; }
    var done=raw.slice(0,ix), tail=raw.slice(ix+1);
    done.split(SPLIT_LINES).forEach(function(L){ if(L.trim()) walkLine(j,L); });
    V.walkText=tail; save();
    /* 打っている欄はそのまま。入った行だけ上に足す */
    el.value=tail; walkRepaint(j);
    return;
  }
  if(el.dataset.saybox!==undefined){ V.sayText=el.value; return; }
  if(el.dataset.imptext!==undefined){
    /* 改行までを確定とみなす。読めた行は入れて消し、読めなかった行は残す */
    var raw=el.value, ix=raw.lastIndexOf("\n");
    if(ix>=0){
      var done=raw.slice(0,ix), tail=raw.slice(ix+1);
      var pv2=sayParse(V.cat, done, impFixed(j));
      if(pv2.rows.length){
        sayApply(j, V.cat, pv2);
        V.impGot=(V.impGot||0)+pv2.rows.length;
      }
      if(pv2.doubt.length) sayDoubt(j, pv2.doubt);
      /* 読めなかった行は窓に残す。黙って捨てない */
      var keep=pv2.bad.concat(tail?[tail]:[]).join("\n");
      V.impText=keep;
      if(pv2.rows.length||pv2.doubt.length){
        var caret=keep.length;
        render();
        toast(sayMsg(pv2));
        var ta=document.querySelector("[data-imptext]");
        if(ta){ ta.focus(); try{ ta.setSelectionRange(caret,caret); }catch(e){} }
        return;
      }
      el.value=keep; save(); return;
    }
    V.impText=raw;
    save();
    return;
  }
  if(el.dataset.rspec){
    var xi=+el.dataset.rspec, xit=j.items[xi];
    var xri=(V.arow&&V.arow[0]===xi)?V.arow[1]:xit.rows.length-1;
    if(!xit.rows[xri]) xri=xit.rows.length-1;
    xit.rows[xri].spec=el.value;
    delete j.sample; save(); return;
  }
  if(el.dataset.pkf){
    var fp=el.dataset.pkf.split("|"), fit=j.items[+fp[0]];
    if(fp[1]==="_") fit[fp[2]]=el.value;
    else { (fit[fp[1]]=fit[fp[1]]||{})[fp[2]]=el.value; }
    delete j.sample; save(); return;
  }
  if(el.dataset.pkd){
    var wp=el.dataset.pkd.split("|"), wit=j.items[+wp[0]];
    ((wit[wp[1]].d=wit[wp[1]].d||{}))[wp[2]]=el.value;
    delete j.sample; save(); return;
  }
  if(el.dataset.pkq){
    var qp=el.dataset.pkq.split("|");
    j.items[+qp[0]].parts[+qp[1]].q=Math.max(0,Math.round(+el.value||0));
    delete j.sample; save(); return;
  }
  if(el.dataset.eq){
    var er=j.items[+el.dataset.i].rows[+el.dataset.ri];
    (er.eq=er.eq||{})[el.dataset.eq]=el.value;
    delete j.sample; save();
    /* 品番が入ったら赤枠と警告を消す。描き直すと入力が途切れるので直接触る */
    if(el.dataset.eq==="model"){
      var box=el.closest(".eqbox");
      if(box){
        var ok=!!el.value.trim();
        box.classList.toggle("miss",!ok);
        el.style.borderColor = ok ? "" : "var(--crit)";
        var wn=box.querySelector(".eqwarn"); if(wn) wn.hidden=ok;
      }
    }
    return;
  }
  if(el.dataset.e!=null){ j.equip[+el.dataset.i][el.dataset.e]=el.value; save(); return; }
  if(el.dataset.s!=null){ j.issues[+el.dataset.i][el.dataset.s]=el.value; save(); return; }
});
document.addEventListener("focusin",function(e){

    V.arow=[+el.dataset.i,+el.dataset.ri];
    if(el.dataset.r==="h"||el.dataset.r==="n") V.afield=el.dataset.r;

});

document.addEventListener("click",function(e){

document.addEventListener("change",function(e){
  var el=e.target, j=J(); if(!j||isISS()) return;
  if(el.dataset.chk!=null){
    var s=j.issues[+el.dataset.chk], ci=+el.dataset.ci; s.done=s.done||[];
    var k=s.done.indexOf(ci);
    if(el.checked&&k<0) s.done.push(ci); if(!el.checked&&k>=0) s.done.splice(k,1);
    save(); return render();
  }
  if(el.dataset.shot!=null){
    j.photoDone=j.photoDone||[];
    var p=el.dataset.shot, kk=j.photoDone.indexOf(p);
    if(el.checked&&kk<0) j.photoDone.push(p); if(!el.checked&&kk>=0) j.photoDone.splice(kk,1);
    save(); return render();
  }
  if(el.dataset.s==="sym"||el.dataset.e==="kind") render();
});

/* 入力中は全体を描き直さず、数字だけ差し替える */
function soft(){
  var j=J(); if(!j||V.view!=="koushu") return;
  (j.items||[]).forEach(function(it,idx){
    if(it.cat!==V.cat) return;
    var el=document.getElementById("it"+idx); if(!el) return;
    el.querySelectorAll(".rrow").forEach(function(rel,ri){
      var r=it.rows&&it.rows[ri]; if(!r) return;
      rel.querySelector(".o").textContent=rowShown(it,r);
    });
    var tt=el.querySelector(".rtotal b"); if(tt) tt.textContent=fmt(qtyOf(it),2);
    var sb=el.querySelector(".sub"); if(sb) sb.textContent=yen(subOf(it));
  });
  var tot=document.querySelector(".calc .calcrow.total .v");
  if(tot&&isISS()) tot.textContent=yen(catTotal(j,V.cat));
  dock();
}

document.getElementById("themeBtn").addEventListener("click",function(){

  else document.documentElement.removeAttribute("data-theme");
  try{ next?localStorage.setItem("genchoTheme",next):localStorage.removeItem("genchoTheme"); }catch(e){}
});
